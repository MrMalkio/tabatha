<script>
'use strict';
/* ════════════════════ data & derived model ════════════════════ */
const DATA = JSON.parse(document.getElementById('atlas-data').textContent);
const HISTORY = JSON.parse(document.getElementById('atlas-history').textContent);
const STATUS_COLOR = {live:'#3DFFA8',working:'#35C9D4',partial:'#E8A33D','in-progress':'#4DB8FF',planned:'#5F7189',blocked:'#B060FF',broken:'#FF4D5E',killed:'#3A4750',unknown:'#7A8B94',unborn:'#232E35'};
const STATUS_ORDER = ['live','working','in-progress','partial','blocked','broken','planned','killed','unknown'];
const TYPE_SHAPE = {feature:'circle',capability:'circle',service:'hex',infra:'hex',integration:'hex',plan:'diamond',task:'circle',bug:'spike',incident:'spike',repo:'square',branch:'tri',env:'ring',surface:'page',goal:'star',milestone:'star'};

const nodes = DATA.nodes.map(n=>({...n, deps:n.deps||[], affects:n.affects||[], links:n.links||{}}));
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
const edges = (DATA.edges||[]).filter(e=>byId[e.from]&&byId[e.to]);
const clusters = DATA.clusters||[];
const clusterOf = {};
clusters.forEach(c=>c.members.forEach(m=>{clusterOf[m]=c.id;}));

const deg = {}; edges.forEach(e=>{deg[e.from]=(deg[e.from]||0)+1;deg[e.to]=(deg[e.to]||0)+1;});
const depEdges = edges.filter(e=>e.kind==='depends');
const layerMemo = {};
function layerOf(id, seen){
  if(layerMemo[id]!=null) return layerMemo[id];
  seen = seen||new Set(); if(seen.has(id)) return 0; seen.add(id);
  const reqs = depEdges.filter(e=>e.from===id).map(e=>e.to);
  const L = reqs.length? 1+Math.max(...reqs.map(r=>layerOf(r,seen))) : 0;
  layerMemo[id]=L; return L;
}
nodes.forEach(n=>layerOf(n.id));
nodes.forEach(n=>{ if(n.type==='bug'||n.type==='incident'){
  const tg = edges.filter(e=>e.kind==='affects'&&e.from===n.id).map(e=>layerMemo[e.to]);
  layerMemo[n.id] = tg.length? Math.round(tg.reduce((a,b)=>a+b,0)/tg.length) : (layerMemo[n.id]||0);
}});
const maxLayer = Math.max(1,...nodes.map(n=>layerMemo[n.id]||0));
const clusterIdx = {}; clusters.forEach((c,i)=>clusterIdx[c.id]=i);

/* blast radius: direct = what a source degrades; downstream = dependents of the wounded */
function blastOf(id){
  const direct=new Set(), down=new Set();
  edges.filter(e=>e.kind==='affects'&&e.from===id).forEach(e=>direct.add(e.to));
  if(byId[id] && (byId[id].status==='broken'||byId[id].status==='blocked') && byId[id].type!=='bug' && byId[id].type!=='incident') direct.add(id);
  const wounded = new Set(direct);
  let grew=true;
  while(grew){ grew=false;
    depEdges.forEach(e=>{ // e.from depends on e.to
      if(wounded.has(e.to)&&!wounded.has(e.from)&&e.from!==id){ wounded.add(e.from); down.add(e.from); grew=true; }
    });
  }
  down.forEach(d=>{ if(direct.has(d)) down.delete(d); });
  return {direct, down};
}
/* hypothetical break: what if THIS node went down right now */
function simBlastOf(id){
  const direct=new Set([id]), down=new Set();
  const wounded=new Set([id]);
  let grew=true;
  while(grew){ grew=false;
    depEdges.forEach(e=>{
      if(wounded.has(e.to)&&!wounded.has(e.from)){ wounded.add(e.from); down.add(e.from); grew=true; }
    });
  }
  return {direct, down};
}

/* ═══ importance & drag weight ═══
   importance = 1 + direct dependents + sub-features (part-of children)
   drag       = negative impact: wounded sources score their own importance
                + importance of everything they directly degrade
                + half the importance of everything downstream at risk
   score      = drag*10 + importance  → with wounds present, wounds dominate the scale;
                all-green, the same scale degrades gracefully to chokepoint/high-value ranking */
const importance = {};
nodes.forEach(n=>{
  importance[n.id] = 1
    + depEdges.filter(e=>e.to===n.id).length
    + edges.filter(e=>e.kind==='part-of'&&e.to===n.id).length;
});
let maxScore=1, scoreSorted=[];
function computeDrag(){
  nodes.forEach(n=>{ n.drag=0; n.crit=importance[n.id]; });
  nodes.forEach(n=>{
    const wounded=(n.type==='bug'||n.type==='incident')? n.status!=='killed' : (n.status==='broken'||n.status==='blocked');
    if(!wounded) return;
    const b=blastOf(n.id);
    let s=importance[n.id];
    b.direct.forEach(id=>{ if(id!==n.id) s+=importance[id]; });
    b.down.forEach(id=>{ s+=0.5*importance[id]; });
    n.drag=s;
  });
  // nodes being degraded (but not sources) carry residual drag
  nodes.forEach(n=>{ if(n.drag===0){
    if(edges.some(e=>e.kind==='affects'&&e.to===n.id&&byId[e.from].status!=='killed')) n.drag=importance[n.id]*0.4;
  }});
  nodes.forEach(n=>{ n.score=n.drag*10+n.crit; });
  scoreSorted=[...nodes].sort((a,b)=>a.score-b.score).map(n=>n.score);
  maxScore=scoreSorted[scoreSorted.length-1]||1;
}
computeDrag();
let dragSliderVal=0, dragThresh=0;

/* ═══ goal pull ═══ target a goal/milestone/component; every node scores how much it
   feeds (requirement tree, decaying by depth), plans that cover it, or wounds that block it */
let goalId=null, pullSliderVal=0, pullThresh=0, pullSorted=[];
function computePull(){
  nodes.forEach(n=>n.pull=0);
  if(!goalId) return;
  const depth={[goalId]:0}; let frontier=[goalId];
  while(frontier.length){
    const next=[];
    frontier.forEach(id=>{
      const step=(to)=>{ if(depth[to]===undefined){ depth[to]=depth[id]+1; next.push(to); } };
      edges.forEach(e=>{
        if(e.from===id && (e.kind==='depends'||e.kind==='plans')) step(e.to);  // what it needs / covers
        if(e.to===id && e.kind==='part-of') step(e.from);                      // its children
      });
    });
    frontier=next;
  }
  nodes.forEach(n=>{
    if(depth[n.id]!==undefined) n.pull = importance[n.id]/Math.pow(1.6, depth[n.id]);
  });
  byId[goalId].pull = Math.max(byId[goalId].pull, importance[goalId]*2);
  nodes.forEach(n=>{
    edges.filter(e=>e.from===n.id&&(e.kind==='affects'||e.kind==='plans')).forEach(e=>{
      if(depth[e.to]!==undefined)
        n.pull=Math.max(n.pull,(e.kind==='affects'?2.2:0.8)*importance[e.to]/Math.pow(1.4,depth[e.to]));
    });
  });
  pullSorted=nodes.map(n=>n.pull).sort((a,b)=>a-b);
}

/* ═══ recency ═══ how lately a node was touched. Reads updatedAt, else lastComment, else the
   first date in its activity string. Fresh mode ranks by literal recency; STALE mode inverts it
   and weights by importance, so it surfaces neglected load-bearing work rather than dead paper.
   Both modes are modulated by BUZZ — discussion volume (`comments`) on the node's backing task,
   PR, or thread. Chatter is activity: a node people keep arguing about is alive in a way a silent
   one is not, and a loud node gone quiet is the most telling stale signal on the map. */
const NOW_MS = Date.parse(DATA.updated||'') || Date.now();
function parseWhen(n){
  if(n.updatedAt){ const t=Date.parse(n.updatedAt); if(!isNaN(t)) return t; }
  if(n.lastComment){ const t=Date.parse(n.lastComment); if(!isNaN(t)) return t; }
  const s=n.activity||'';
  let m=s.match(/20\d\d-\d{1,2}-\d{1,2}/);
  if(m){ const t=Date.parse(m[0]); if(!isNaN(t)) return t; }
  m=s.match(/\b(\d{1,2})\/(\d{1,2})\b/);
  if(m){ const y=new Date(NOW_MS).getUTCFullYear();
    let t=Date.UTC(y,+m[1]-1,+m[2]);
    if(t>NOW_MS+3*864e5) t=Date.UTC(y-1,+m[1]-1,+m[2]);   // "12/28" seen in August = last year
    return t; }
  return null;
}
let recInvert=false, recSliderVal=0, recThresh=0, recSorted=[];
/* buzz: 0…1 from comment volume, log-scaled — 20+ comments saturates. A node nobody has
   commented on scores 0 and is judged on dates alone (backward-compatible with data
   predating the field). */
const BUZZ_FULL = Math.log1p(20);
function buzzOf(n){
  const c = Number(n.comments)||0;
  return c<=0? 0 : Math.min(1, Math.log1p(c)/BUZZ_FULL);
}
function computeRecency(){
  nodes.forEach(n=>{
    const t=parseWhen(n); n.when=t;
    const days = t===null? null : Math.max(0,(NOW_MS-t)/864e5);
    n.freshness = days===null? 0 : 1/(1+days/14);
    n.buzz = buzzOf(n);
    const unreal = n.status==='planned'||n.status==='killed'||n.status==='unborn';
    n.recScore = recInvert
      // stale hunt: load-bearing + neglected, and LOUDER the more discussion it accumulated
      // before going quiet — a 30-comment thread nobody has touched in two months outranks
      // a silent doc of the same importance.
      ? (unreal? 0 : importance[n.id]*(1-n.freshness)*(1+0.8*n.buzz))
      // fresh front: recent work, with active discussion pulled forward.
      : n.freshness*100*(1+0.6*n.buzz) + importance[n.id]*0.1 + n.buzz*2;
  });
  recSorted=nodes.map(n=>n.recScore).sort((a,b)=>a-b);
}
computeRecency();
function daysAgoLabel(n){
  if(n.when===null||n.when===undefined) return 'no recorded activity';
  const d=Math.round((NOW_MS-n.when)/864e5);
  return d<=0?'today':d===1?'yesterday':d+' days ago';
}

/* ═══ views ═══ saved filter presets declared in the data; they re-shape the map in place */
const VIEWS = DATA.views||[];
let activeView=null;
function allSet(o){ return new Set(Object.keys(o)); }
function applyView(id){
  const v=VIEWS.find(x=>x.id===id);
  if(!v || activeView===id){
    activeView=null;
    F.type=allSet(TYPE_SHAPE); F.status=allSet(STATUS_COLOR); F.cluster=new Set(clusters.map(c=>c.id));
    document.getElementById('viewBanner').classList.remove('show');
  } else {
    activeView=id;
    F.type = v.types? new Set(v.types) : allSet(TYPE_SHAPE);
    F.status = v.statuses? new Set(v.statuses) : allSet(STATUS_COLOR);
    F.cluster = v.clusters? new Set(v.clusters) : new Set(clusters.map(c=>c.id));
    const n=nodes.filter(visibleN).length;
    document.getElementById('viewNote').textContent=(v.note||v.label)+' — '+n+' nodes';
    const a=document.getElementById('viewPage');
    if(v.page){ a.href=v.page; a.textContent='open the full page →'; a.style.display=''; } else a.style.display='none';
    document.getElementById('viewBanner').classList.add('show');
  }
  refreshVis(); buildRail(); renderViewChips();
  fitAt = tick + 45;   // let the simulation re-form, then frame it
}
/* frame whatever is currently visible — so a view lands ON its nodes instead of
   leaving the camera parked over empty space while the organism re-forms */
let fitAt=null;
function fitVisible(pad=1.25){
  const vis=nodes.filter(n=>visSet.has(n.id)&&n._p);
  if(!vis.length) return;
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  vis.forEach(n=>{const p=n._p;minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y);});
  const w=Math.max(160,(maxx-minx)*pad), h=Math.max(160,(maxy-miny)*pad);
  const railW=document.getElementById('rail').classList.contains('hidden')?40:280;
  cam.z=Math.max(0.3,Math.min(2.2,Math.min((W-railW-60)/w,(H-230)/h)));
  // nudge right so the rail does not sit on top of the framed content
  cam.x=-(minx+maxx)/2*cam.z + (railW-40)/2;
  cam.y=-(miny+maxy)/2*cam.z;
}
function renderViewChips(){
  const host=document.getElementById('viewChips'); if(!host) return;
  host.innerHTML=VIEWS.map(v=>`<button class="viewchip ${activeView===v.id?'on':''}" data-view="${esc(v.id)}" title="${esc(v.note||'')} — filters the map in place">${esc(v.label)}</button>`).join('');
  host.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>applyView(b.dataset.view));
}

/* ═══ time travel ═══ */
let timeIdx=null; // null = NOW
let labelMode='smart';
function applyTime(k){
  if(k>=HISTORY.length){
    timeIdx=null;
    nodes.forEach(n=>{ if(n._nowStatus!==undefined){ n.status=n._nowStatus; delete n._nowStatus; } });
  } else {
    timeIdx=k; const h=HISTORY[k];
    nodes.forEach(n=>{ if(n._nowStatus===undefined) n._nowStatus=n.status; n.status=h.s[n.id]||'unborn'; });
  }
  computeDrag(); computeRecency(); buildVitals();
}

/* ═══ overall ratings — computed from what the map knows ═══ */
function ratings(){
  const lad={live:1,working:.85,partial:.55,'in-progress':.35,blocked:.25,broken:.3,planned:0,killed:0,unknown:.3};
  const sys=nodes.filter(n=>TYPE_LAYER[n.type]===0);
  const impTot=sys.reduce((s,n)=>s+importance[n.id],0)||1;
  const completion=sys.reduce((s,n)=>s+(lad[n.status]??0)*importance[n.id],0)/impTot;
  const woundedIds=new Set();
  nodes.forEach(n=>{ if(n.drag>0){ const b=blastOf(n.id); b.direct.forEach(id=>woundedIds.add(id)); b.down.forEach(id=>woundedIds.add(id)); }});
  const health=1 - sys.filter(n=>woundedIds.has(n.id)||n.status==='broken'||n.status==='blocked')
    .reduce((s,n)=>s+importance[n.id],0)/impTot;

  const sec=nodes.filter(n=>secRe.test(n.id+' '+n.label+' '+(n.blurb||'')));
  const secImp=sec.reduce((s,n)=>s+importance[n.id],0)||1;
  const security=sec.length? sec.reduce((s,n)=>s+((n.type==='bug'||n.type==='incident')?(n.status==='killed'?1:0):(lad[n.status]??0))*importance[n.id],0)/secImp : 0;
  const top=[...sys].sort((a,b)=>importance[b.id]-importance[a.id]).slice(0,10);
  const fragility=top.reduce((s,n)=>s+simBlastOf(n.id).down.size,0)/((top.length*sys.length)||1);

const RATING_DESC={
  completion:'Importance-weighted status ladder over the SYSTEM plane: planned=0 … live=1.',
  health:'Share of importance-weighted system NOT currently degraded or downstream of a wound.',
  security:'Status of security-touching nodes (auth, RLS, PATs, impersonation, hardening) with their open bugs counted against.',
  strength:'Resilience: how small the average break-simulation blast of the 10 most load-bearing nodes is.',
  pulse:'Share of nodes with recorded recent activity, plus partial credit for discussion volume — how alive the work is.',
  speed:'Not yet computable — needs latency/throughput probes as data. Placeholder.'};

/* ════════════════════ canvas / camera ════════════════════ */
let W=innerWidth, H=innerHeight;
const canvas = document.getElementById('web'), ctx = canvas.getContext('2d');
const DPR = Math.min(devicePixelRatio||1, 2);
function resize(){ W=innerWidth;H=innerHeight; canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize); resize();

let density = 0.55, spread = 0.55, tilt = 0, yaw = 0;
const cam = {x:0,y:0,z:1};
/* strata: code+environments beneath, the real system on the base plane, work above, wounds on top */
const TYPE_LAYER = {repo:-1,branch:-1,env:-1, feature:0,capability:0,service:0,infra:0,integration:0,surface:0, plan:1, task:1, goal:1, milestone:1, bug:2, incident:2};
const LAYER_NAMES = {'-1':'SUBSTRATE — code & environments','0':'SYSTEM — what exists','1':'WORK — plans & tasks about it','2':'WOUNDS — bugs & incidents'};
const LAYER_COLS = {'-1':'rgba(150,170,120,','0':'rgba(53,201,212,','1':'rgba(120,140,180,','2':'rgba(255,77,94,'};
const ELEV = 240;
/* starfield in world space (parallax comes free from projection) */
const stars = Array.from({length:340},(_,i)=>({wx:(hash('sx'+i)%5000)-2500, wy:(hash('sy'+i)%3600)-1800, h:(hash('sh'+i)%1400)-350, tw:(hash('st'+i)%1000)/1000}));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function hash(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
function baseR(n){
  // size = how much depends on this (importance) × how real it is (status ladder)
  const imp = Math.min(importance[n.id]||1, 24);
  let r = 4 + Math.sqrt(imp)*3.1;
  const ladder = {live:1.2, working:1.05, partial:0.95, 'in-progress':0.85, blocked:0.8, broken:1.0, planned:0.55, killed:0.5, unknown:0.7}[n.status] ?? 1;
  r *= ladder;
  if(n.type==='plan') r = Math.max(3.5, r*0.6);
  if(n.type==='bug'||n.type==='incident') r = Math.max(4.5, r*0.8);
  if(n.priority==='high') r += 2;
  // a planned feature that has a written implementation plan grows
  if(n.status==='planned' && edges.some(e=>e.kind==='plans'&&e.to===n.id)) r *= 1.35;
  return Math.max(3.5, r);
}
nodes.forEach((n,i)=>{
  const ci = clusterIdx[clusterOf[n.id]] ?? (i%Math.max(1,clusters.length||1));
  const nc = Math.max(1,clusters.length);
  n.x = (ci+0.5)/nc*1600-800 + (hash(n.id)%400-200);
  n.y = (layerMemo[n.id]/maxLayer)*1200-600 + (hash(n.id+'y')%140-70);
  n.r = baseR(n);
  n.phase = (hash(n.id)%1000)/1000*Math.PI*2;
});

/* ════════════════════ filters ════════════════════ */
const F = { type:new Set(Object.keys(TYPE_SHAPE)), status:new Set(Object.keys(STATUS_COLOR)), cluster:new Set(clusters.map(c=>c.id)), q:'' };
function visibleN(n){
  if(!F.type.has(n.type)||!F.status.has(n.status)) return false;
  const c = clusterOf[n.id]; if(c && !F.cluster.has(c)) return false;
  if(F.q && !(n.label+' '+n.id+' '+(n.blurb||'')).toLowerCase().includes(F.q)) return false;
  return true;
}
let visSet = new Set();

/* ════════════════════ d3-force simulation ════════════════════ */
const links = edges.map(e=>({...e, source:e.from, target:e.to}));
const linkForce = d3.forceLink().id(d=>d.id).strength(l=>l.kind==='affects'?0.35:l.kind==='depends'?0.25:0.12);
const charge = d3.forceManyBody().theta(0.9);
const collide = d3.forceCollide(n=>n.r+7).strength(0.8);
const fx = d3.forceX(n=>{ const ci=clusterIdx[clusterOf[n.id]]; const nc=Math.max(1,clusters.length);
  return ci!=null? ((ci+0.5)/nc-0.5)*(500+2100*spread) : 0; }).strength(()=>0.02+0.05*spread);
const fy = d3.forceY(n=>(layerMemo[n.id]-maxLayer/2)*(90+260*spread)).strength(0.09);
const sim = d3.forceSimulation()
  .force('link',linkForce).force('charge',charge).force('collide',collide)
  .force('x',fx).force('y',fy)
  .velocityDecay(0.4).alphaDecay(0.015).alphaMin(0.003).stop();

function applyForces(){
  charge.strength(-30-1100*(1-density));
  linkForce.distance(l=>{ const base=(50+130*spread)*(1+1.1*(1-density)); return l.kind==='affects'?base*0.55:l.kind==='part-of'?base*0.8:base; });
  collide.radius(n=>n.r+3+30*(1-density));
  fx.initialize(sim.nodes()); fy.initialize(sim.nodes());
}
function refreshVis(){
  visSet = new Set(nodes.filter(visibleN).map(n=>n.id));
  const act = nodes.filter(n=>visSet.has(n.id));
  sim.nodes(act);
  linkForce.links(links.filter(l=>visSet.has(l.from)&&visSet.has(l.to)));
  applyForces();
  sim.alpha(0.6).restart();
}
refreshVis();

/* particles */
const particles = [];
function seedParticles(){
  particles.length=0;
  if(reduceMotion) return;
  links.forEach(l=>{
    const a=byId[l.from],b=byId[l.to];
    const hot=(a.status==='live'||b.status==='live'||a.status==='working'||b.status==='working');
    if(hot && l.kind!=='affects' && Math.random()<0.7) particles.push({l,t:Math.random(),sp:0.0015+Math.random()*0.0025});
    if(l.kind==='affects') particles.push({l,t:Math.random(),sp:0.004+Math.random()*0.003,bad:true});
  });
}
seedParticles();

/* ════════════════════ render ════════════════════ */
let hoverNode=null, selNode=null, hoverLink=null, selLink=null, tick=0;
let blast=null; // {direct:Set, down:Set, srcId}
function nodeOf(ref){ return typeof ref==='object'? ref : byId[ref]; }
const FOV=1500;
function elevOf(n){ return (TYPE_LAYER[n.type]||0)*ELEV; }
function project(wx,wy,h){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const rx=wx*cy - wy*sy, ry=wx*sy + wy*cy;
  const p=tilt*1.78, cp=Math.cos(p), sp=Math.sin(p);   // full range: 0 = flat map, past 90° at max so upper strata read from below
  const d=ry*sp;

}

}
function edgeCurve(a,b,l){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const dx=b.x-a.x, dy=b.y-a.y; const d=Math.sqrt(dx*dx+dy*dy)||1;
  const s = ((hash(l.from+l.to)%100)/100-0.5)*0.5;

function draw(){
  tick++;

  const g=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.9);
  g.addColorStop(0, blast? '#120a10' : tilt>0.1? '#050b14' : '#071118'); g.addColorStop(1,'#03070A');

  }

    if(n.status==='unborn') return Math.min(a,0.06);
    if(dragSliderVal>0.01 && timeIdx===null && n.score<dragThresh) a=Math.min(a, Math.max(0.05, 0.4-dragSliderVal*0.4));
    if(goalId && pullSliderVal>0.01 && n.pull<Math.max(pullThresh,0.001)) a=Math.min(a, Math.max(0.05, 0.4-pullSliderVal*0.4));

    } else {

      if(l.kind==='affects'){ col='rgba(255,77,94,'; w=1.3; alpha=dimmed?0.05:0.45; }
      else if(l.kind==='plans'){ col='rgba(95,113,137,'; w=0.8; dash=[3,5]; alpha=dimmed?0.04:0.3; }
      else if(l.kind==='part-of'){ col='rgba(62,85,96,'; w=0.7; alpha=dimmed?0.04:0.3; }
      else { const hot=(a.status==='live'&&(b.status==='live'||b.status==='working'));

    if(goalId && pullSliderVal>0.01 && !blast && (a.pull<pullThresh||b.pull<pullThresh)) alpha=Math.min(alpha,0.05);
    if(l===hoverLink||l===selLink){ w+=1.4; alpha=Math.min(1,alpha+0.35); }

  // depth-sorted painter's order: far first, higher strata over lower
  const order = nodes.filter(n=>visSet.has(n.id)).sort((a,b)=>(b._p.d-a._p.d)||(elevOf(a)-elevOf(b)));
  order.forEach(n=>{
    const col = STATUS_COLOR[n.status]||STATUS_COLOR.unknown;
    const alpha = nodeAlpha(n);
    const isFocus = n===focus || (blast&&n.id===blast.srcId);
    const pulse = reduceMotion?1: 1+Math.sin(tick*0.04+n.phase)*0.06;
    const px=n._p.x, py=n._p.y;
    const r = n.r*(isFocus?1.25:1)*pulse*n._p.s;   // size = importance × proximity

    // elevation thread: tie floating strata back to their spot on the base plane
    if(tilt>0.08 && TYPE_LAYER[n.type]!==0 && alpha>0.3){
      const base=project(n.x,n.y,0);
      ctx.strokeStyle='rgba(110,135,146,'+(0.10*Math.min(1,tilt*3))+')';
      ctx.lineWidth=0.6/cam.z; ctx.setLineDash([2,4]);
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(base.x,base.y);ctx.stroke();ctx.setLineDash([]);
    }

    if((n.status==='live'||n.status==='working') && alpha>0.5){
      const glowR = r*(n.status==='live'?4.2:2.8);
      const gg=ctx.createRadialGradient(px,py,r*0.4,px,py,glowR);
      gg.addColorStop(0,(n.status==='live'?'rgba(61,255,168,':'rgba(53,201,212,')+(reduceMotion?0.24:0.18+0.1*Math.sin(tick*0.05+n.phase))+')');

      ctx.lineWidth=1.6/cam.z**0.3; ctx.setLineDash(blast.down.has(n.id)?[3,3]:[]);
      ctx.beginPath();ctx.arc(px,py,r+4.5,0,7);ctx.stroke(); ctx.setLineDash([]);
    }
    // amber arc = recorded activity. Its sweep and brightness grow with BUZZ (comment volume),
    // so a heavily-discussed node reads as a near-closed ring and a quiet one as a short tick.
    if((n.activity || n.buzz>0) && alpha>0.5 && !blast){

    const showLabel = labelMode==='all' ? alpha>0.3
      : labelMode==='off' ? isFocus
      : ( isFocus || (activeView && visSet.size<=45 && alpha>0.3) || (alpha>0.3 && n._p.s>0.5 && (
            r*cam.z>8.5                                      // big/near first
         || (n.priority==='high' && cam.z>0.5)               // then high-priority
         || (n.drag>0 && n.score>=scoreSorted[Math.floor(scoreSorted.length*0.88)] && cam.z>0.4) // then high-drag

  const show=tilt>0.05;
  for(const L of [-1,0,1,2]){
    const tag=planeTags[L]; if(!tag) continue;
    if(!show){ tag.style.opacity=0; continue; }
    const p=project(0,1000,L*ELEV);   // near-edge of each plane
    const sy=H/2+cam.y+p.y*cam.z;
    tag.style.opacity=Math.min(1,tilt*3);
    tag.style.top=Math.max(64,Math.min(H-40,sy-12))+'px';
    tag.textContent=LAYER_NAMES[String(L)];

}
const planeTags={};
[-1,0,1,2].forEach(L=>{const d=document.createElement('div');d.className='planeTag';d.style.opacity=0;document.body.appendChild(d);planeTags[L]=d;});
function drawShape(n,px,py,r,col){
  const shape=TYPE_SHAPE[n.type]||'circle';
  ctx.fillStyle=col; ctx.strokeStyle='rgba(4,9,12,.9)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  if(shape==='hex'){ for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3; const x=px+Math.cos(a)*r*1.1,y=py+Math.sin(a)*r*1.1; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath(); }

  else if(shape==='page'){ const w2=r*0.85,h2=r*1.15,f=r*0.5;
    ctx.moveTo(px-w2,py-h2);ctx.lineTo(px+w2-f,py-h2);ctx.lineTo(px+w2,py-h2+f);ctx.lineTo(px+w2,py+h2);ctx.lineTo(px-w2,py+h2);ctx.closePath(); }
  else if(shape==='star'){ for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5; const rr=i%2? r*0.5:r*1.25; const x=px+Math.cos(a)*rr,y=py+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath(); }
  else if(shape==='tri'){ ctx.moveTo(px,py-r*1.2);ctx.lineTo(px+r*1.05,py+r*0.85);ctx.lineTo(px-r*1.05,py+r*0.85);ctx.closePath(); }
  else if(shape==='ring'){ ctx.arc(px,py,r,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(4,9,12,.92)'; ctx.beginPath(); ctx.arc(px,py,r*0.55,0,7); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(px,py,r*0.55,0,7); ctx.stroke(); return; }
  else ctx.arc(px,py,r,0,7);
  ctx.fill(); ctx.stroke();
  if(n.status==='planned'||n.status==='unknown'){ ctx.fillStyle='rgba(4,9,12,.75)'; ctx.beginPath();ctx.arc(px,py,r*0.5,0,7);ctx.fill(); }
}

let dragNode=null, panning=false, orbiting=false, px=0, py=0, moved=false;
function toWorld(mx,my){ return {x:(mx-W/2-cam.x)/cam.z, y:(my-H/2-cam.y)/cam.z}; }
function pickNode(mx,my){
  const w=toWorld(mx,my); let best=null,bd=1e9,bdepth=1e9;
  nodes.forEach(n=>{ if(!visSet.has(n.id)||!n._p)return;
    const d=Math.hypot(n._p.x-w.x,n._p.y-w.y);
    const hit=Math.max(n.r*n._p.s+6,12);
    if(d<hit && (n._p.d<bdepth-1 || d<bd)){bd=d;bdepth=n._p.d;best=n;} });
  return best;
}
function pickLink(mx,my){
  const w=toWorld(mx,my); let best=null,bd=7/Math.sqrt(cam.z);
  links.forEach(l=>{
    const a=nodeOf(l.source), b=nodeOf(l.target);
    if(!visSet.has(a.id)||!visSet.has(b.id)||!a._p||!b._p) return;
    const pa=a._p, pb=b._p;
    if(w.x<Math.min(pa.x,pb.x)-20||w.x>Math.max(pa.x,pb.x)+20||w.y<Math.min(pa.y,pb.y)-20||w.y>Math.max(pa.y,pb.y)+20) return;
    const c=edgeCurve(pa,pb,l);
    for(let t=0.08;t<=0.92;t+=0.06){
      const p=qpoint(pa,c,pb,t);
      const d=Math.hypot(p.x-w.x,p.y-w.y);
      if(d<bd){bd=d;best=l;}
    }
  });
  return best;
}

canvas.addEventListener('pointerdown',e=>{

  dragNode = tilt<0.05? pickNode(e.clientX,e.clientY) : null;   // plane-drag only in flat view
  if(dragNode){ dragNode.fx=dragNode.x; dragNode.fy=dragNode.y; sim.alphaTarget(0.25).restart(); }

canvas.addEventListener('pointermove',e=>{

    px=e.clientX;py=e.clientY; moved=true;
  }
  else if(dragNode){ const s=toWorld(e.clientX,e.clientY); const w=unprojectPlane(s.x,s.y); dragNode.fx=w.x;dragNode.fy=w.y; moved=Math.hypot(e.clientX-px,e.clientY-py)>4||moved; }
  else if(panning){ cam.x+=e.clientX-px; cam.y+=e.clientY-py; px=e.clientX;py=e.clientY; moved=true; }
  else {
    const hn=pickNode(e.clientX,e.clientY);

});
canvas.addEventListener('pointerup',e=>{
  if(orbiting){ orbiting=false; canvas.classList.remove('dragging'); buildRail(); return; }
  if(dragNode){ dragNode.fx=null;dragNode.fy=null; sim.alphaTarget(0); }
  if(!moved){
    const n=pickNode(e.clientX,e.clientY);
    if(n) openDossier(n);
    else { const l=pickLink(e.clientX,e.clientY);
      if(l) openEdgeDossier(l);
      else clearSel(); }
  }
  dragNode=null;panning=false;canvas.classList.remove('dragging');
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0012);
  const wx=(e.clientX-W/2-cam.x)/cam.z, wy=(e.clientY-H/2-cam.y)/cam.z;
  cam.z=Math.min(3.5,Math.max(0.25,cam.z*f));
  cam.x=e.clientX-W/2-wx*cam.z; cam.y=e.clientY-H/2-wy*cam.z;
},{passive:false});

/* Link values stay backward-compatible with strings, but may also carry a human label:
   {url:"https://app.asana.com/...",label:"Task title"}. Arrays attach multiple named sources. */
function linkEntries(value){
  const values=Array.isArray(value)?value:(value?[value]:[]);
  return values.map(v=>{
    if(typeof v==='string') return {url:v,label:''};
    if(!v||typeof v!=='object') return {url:'',label:''};
    return {url:v.url||v.href||v.path||'',label:v.label||v.title||v.name||''};
  }).filter(v=>v.url);
}
function linkPrompt(value,kind){
  return linkEntries(value).map(v=>`\n- ${kind}: ${v.label?v.label+' — ':''}${v.url}`).join('');
}
/* What a link READS as. A permalink tells a human nothing, so an unlabeled entry never renders
   as a bare URL — it degrades to the most human thing derivable from the URL shape. Authored
   labels always win; this is the floor, not the goal (sync-data.js warns on every miss). */
function linkText(v,kind){
  if(v.label) return v.label;
  const u=v.url||'';
  if(kind==='asana'){
    const t=u.match(/\/task\/(\d+)/)||u.match(/\/0\/\d+\/(\d+)/);
    if(t) return 'Asana task '+t[1];
    const pr=u.match(/\/project\/(\d+)/); if(pr) return 'Asana project '+pr[1];
    const g=u.match(/\/goal\/(\d+)/);     if(g)  return 'Asana goal '+g[1];
    const p=u.match(/\/post\/(\d+)/);     if(p)  return 'Asana post '+p[1];
    return 'Asana item (untitled — add a label)';
  }
  if(kind==='gh'){
    const m=u.match(/github\.com\/([^/]+\/[^/]+)\/(pull|issues)\/(\d+)/);
    if(m) return `${m[2]==='pull'?'PR':'Issue'} #${m[3]} · ${m[1]}`;
    return u.replace('https://github.com/','');
  }
  if(kind==='web'){
    try{ const x=new URL(u); return x.hostname.replace(/^www\./,'')+(x.pathname==='/'?'':x.pathname); }
    catch{ return u.replace(/^https?:\/\//,''); }
  }
  return u;
}

function openEdgeDossier(l){

const STATUS_DESC={live:'Verified functional in production',working:'Running, but with known caveats',
  'in-progress':'Being built right now',partial:'Some of it is real, gaps remain',blocked:'Waiting on a gate or dependency',
  broken:'Down or failing, right now',planned:'Paper only — nothing built yet',killed:'Resolved or retired (kept briefly for visibility, then deleted)',unknown:'No trustworthy evidence either way',unborn:'Did not exist at this point in time'};
const TYPE_DESC={feature:'A user- or agent-facing capability',capability:'An internal ability of the system',
  service:'A running process/daemon',infra:'Underlying infrastructure (DB, host)',integration:'A bridge to an external system',
  plan:'A written implementation plan (P##)',task:'A tracked work item',bug:'An open defect',incident:'A postmortem-class event',

function frow(label,color,round,set,key,count,tip){
  const on=set.has(key);
  return `<div class="frow ${on?'':'off'}" title="${esc(tip||'')} — click to toggle visibility" data-set="${set===F.type?'type':set===F.status?'status':'cluster'}" data-key="${esc(key)}">
    <span class="sw ${round?'round':''}" style="background:${color}"></span>${esc(label)}<span class="n">${count}</span></div>`;
}
function buildRail(){
  const rail=document.getElementById('rail');
  const tCount=t=>nodes.filter(n=>n.type===t).length;

    ${dialSVG('density','DENSITY',density)}${dialSVG('spread','SPREAD',spread)}${dialSVG('tilt','TILT',tilt)}${dialSVG('rotate','ROTATE',(((yaw/(Math.PI*2))+0.5)%1+1)%1)}
  </div>
  <div class="seg" title="Node name labels: SMART shows big/near/high-impact first and reveals more as you zoom; ALL shows every name; OFF only on hover/selection">
    <button data-lm="smart" class="${labelMode==='smart'?'on':''}">SMART</button><button data-lm="all" class="${labelMode==='all'?'on':''}">ALL</button><button data-lm="off" class="${labelMode==='off'?'on':''}">OFF</button>

const DIAL_TIP={density:'Breathing room — low packs the organism tight, high spreads everything apart (repulsion, spacing, vein length)',
  spread:'Stretch — how far the dependency strata and system columns extend in both dimensions',
  tilt:'Lift the map out of flat view into its strata; 100 looks along the planes from slightly below',
  rotate:'Spin the tilted structure left/right (or Shift-drag / right-drag on the map to orbit freely)'};
function dialSVG(id,label,val){
  const a=-135+val*270, rad=(a-90)*Math.PI/180;
  const cx=34,cy=34,r=26;
  const arc=(deg)=>{const rr=(deg-90)*Math.PI/180;return `${cx+Math.cos(rr)*r},${cy+Math.sin(rr)*r}`;};
  return `<div class="dial" title="${esc(DIAL_TIP[id]||'')}"><svg id="dial-${id}" width="68" height="68" viewBox="0 0 68 68">
    <path d="M ${arc(-135)} A ${r} ${r} 0 1 1 ${arc(135)}" fill="none" stroke="#16303A" stroke-width="4" stroke-linecap="round"/>
    <path d="M ${arc(-135)} A ${r} ${r} 0 ${a>45?1:0} 1 ${arc(a)}" fill="none" stroke="#35C9D4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="15" fill="#0F1D24" stroke="#16303A"/>
    <line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(rad)*13}" y2="${cy+Math.sin(rad)*13}" stroke="#3DFFA8" stroke-width="2.5" stroke-linecap="round"/>
    </svg><label>${label}</label><span class="val">${Math.round(val*100)}</span></div>`;
}
function wireDials(){
  [['density',v=>density=v],['spread',v=>spread=v],['tilt',v=>tilt=v],['rotate',v=>yaw=(v-0.5)*Math.PI*2]].forEach(([id,setv])=>{
    const el=document.getElementById('dial-'+id); if(!el)return;
    let dragging=false,sy=0,sv=0;
    el.addEventListener('pointerdown',e=>{dragging=true;sy=e.clientY;
      sv=id==='density'?density:id==='spread'?spread:id==='tilt'?tilt:(((yaw/(Math.PI*2))+0.5)%1+1)%1;
      el.setPointerCapture(e.pointerId);e.preventDefault();});
    el.addEventListener('pointermove',e=>{ if(!dragging)return;
      const v=Math.min(1,Math.max(0,sv+(sy-e.clientY)/150)); setv(v);
      if(id==='density'||id==='spread'){ applyForces(); sim.alpha(0.5).restart(); }
      // live-update needle + arc + value without rebuilding the rail (rebuild would kill pointer capture)
      const a=-135+v*270, rad=(a-90)*Math.PI/180, cx=34,cy=34,r=26;
      const pt=(deg)=>{const rr=(deg-90)*Math.PI/180;return `${cx+Math.cos(rr)*r},${cy+Math.sin(rr)*r}`;};
      el.querySelectorAll('path')[1].setAttribute('d',`M ${pt(-135)} A ${r} ${r} 0 ${a>45?1:0} 1 ${pt(a)}`);
      const ln=el.querySelector('line');
      ln.setAttribute('x2',cx+Math.cos(rad)*13); ln.setAttribute('y2',cy+Math.sin(rad)*13);
      el.parentElement.querySelector('.val').textContent=Math.round(v*100); });
    el.addEventListener('pointerup',()=>{dragging=false;});
  });
}

<p>Each link may be a legacy URL/path string, a named object, or an array of either. Use named objects for
Asana tasks/posts so the dossier shows the human title while the title links to the permalink.</p>
<p><b>Comments are activity.</b> <code>comments</code> is the count on whatever tracker item backs the node —
an Asana task, a PR, a thread. It scales log-wise (20+ saturates) and modulates both RECENCY modes: on the
fresh front a busy thread outranks a quiet one; in STALE mode a node that accumulated a lot of discussion and
then went silent outranks an equally-neglected node nobody ever argued about. It also widens the amber
activity arc and feeds the <i>pulse</i> rating. Refresh it when you refresh <code>activity</code>.</p>
<h3>Edges</h3>
<pre>{"from":"a","to":"b","kind":"depends"}      // a needs b
{"from":"bug-x","to":"a","kind":"affects",   // bug degrades a (red vein)
 "detail":"Symptom, severity, first-seen, workaround — shown when the vein is clicked."}
{"from":"a","to":"parent","kind":"part-of"}
{"from":"p03-plan","to":"sync-engine","kind":"plans"}</pre>
<h3>Rules of the organism</h3>
<p>1. A thing ships → flip <code>status</code> to <code>live</code> (it starts glowing) and update <code>activity</code>.<br>
2. A bug opens → add a <code>bug</code> node + one <code>affects</code> edge per degraded subsystem, each with a <code>detail</code>. Fixed → status <code>killed</code> (delete after a week).<br>
3. New feature → node + its <code>depends</code> edges + add its id to one cluster's <code>members</code>.<br>
4. Vertical position is computed from dependencies, and the tilt-view stratum (SYSTEM / WORK / WOUNDS) is computed from <code>type</code> — never hand-place either.<br>
5. Update <code>summary</code> whenever the overall state of play shifts.<br>
6. Blast radius (what a wound degrades, directly and downstream) is computed from <code>affects</code> + <code>depends</code> edges — keep those honest and the health view stays honest.</p>
<h3>Republish</h3>
<p>Edit the JSON in the repo file, then republish the artifact from the same file path (same URL). Full guide: <code>${ATLAS_PATHS.guide}</code>.</p>
<h3>Template note</h3>
<p>The engine is product-agnostic: drop any product's nodes/edges/clusters/summary into the data block and the same organism renders it.</p>`;
