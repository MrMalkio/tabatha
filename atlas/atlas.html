e-Install Line","type":"infra","status":"live","priority":"high","updatedAt":"2026-07-25","activity":"8/1: probed live — update.xml serves version 6.7.78 for app id jbdkacccpknbiphigeabcdojemnhacjj. Seven CRX files sit in site/enterprise/, 6.7.22 through 6.7.69.","blurb":"The channel that actually puts Tabatha on staff machines: a packed CRX self-hosted on the marketing site, force-installed via Google Workspace admin policy. Its app ID comes from the OUTER CRX signature, not the manifest key — and it was undocumented until archaeology found it on 2026-07-21, because nothing in scripts/ builds it. Retires only once the Web Store item is published.","links":{"web":{"url":"https://tabatha.pondocean.co/enterprise/update.xml","label":"enterprise update.xml — live force-install manifest (6.7.78)"},"md":"docs/OPERATIONS.md"},"sources":["live curl probe 2026-08-01","docs/OPERATIONS.md §2.2b","site/enterprise/"]},{"id":"channel-cws","label":"Chrome Web Store Listing","type":"integration","status":"blocked","priority":"high","updatedAt":"2026-07-21","activity":"7/21: 'CWS listing fill + Workspace force-install' opened and still incomplete. The listing doc's own line 3 reads 'Status: DRAFT — prepared ahead of time, NOT submitted.'","blurb":"The one distribution path that would end the self-hosting workarounds, and the one that has not landed. The whole automation exists — auth, upload, publish and status scripts, a validated key-stripped store zip, screenshots, promo tiles — but the CWS credentials were never provisioned on this machine, first-publish visibility and listing content are console-only actions no agent can perform, and publishTarget still defaults to trustedTesters. Store ID piopncjacohahbkkmockjnpenhdbmmbc is referenced in four edge-function CORS allowlists, but the public URL resolves to an untitled page.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216763466426648","label":"CWS listing fill + Workspace force-install (browser session)"},"md":"docs/CWS-PUBLISHING.md"},"comments":2,"lastComment":"2026-07-21","sources":["docs/CWS-PUBLISHING.md §2b credential reality check","docs/CHROME-WEB-STORE-LISTING.md L3","live probe of chromewebstore.google.com 2026-08-01"]},{"id":"cws-deployment-task","label":"CWS Deployment Push","type":"task","status":"blocked","updatedAt":"2026-07-15","activity":"7/15: five comments in a single session working the unlisted-publish approach, then silence for six weeks.","blurb":"The original push to get Tabatha onto the Web Store for guaranteed staff auto-update. It generated the whole publishing pipeline and then stalled on the parts only Malkio can do: a $5 developer registration, an OAuth client, and console-only listing fields. A loud thread that went quiet with the work 90% done.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/task/1216605548224508","label":"[Caspera] Chrome Web Store deployment — Tabatha unlisted publish (staff distro + guaranteed auto-update)"}},"comments":5,"lastComment":"2026-07-15","sources":["Asana 1216605548224508"]},{"id":"store-assets","label":"Store Assets","type":"infra","status":"working","updatedAt":"2026-07-21","activity":"Promo tiles, marquee, store icon and eight 1280x800 screenshots generated from /show. Newest store zip is 6.7.47 — 35 versions behind HEAD.","blurb":"A complete, professional store kit that is ready and going stale. The screenshots are generated from the live showcase, which is the right pipeline, but nothing regenerates them on release — so the assets describe a version from three weeks ago.","links":{"md":"docs/CHROME-WEB-STORE-LISTING.md"},"sources":["store-assets/ listing","scripts/capture-screenshots.mjs"]},{"id":"logo-redesign","label":"Logo Redesign","type":"feature","status":"partial","updatedAt":"2026-07-21","activity":"7/21: completed and marked Deployed-Live in the tracker, but the audit reports the logo-rollout branch unmerged and Sidecar PWA icons stale since v0.1.0.","blurb":"The eye mark was replaced to kill a surveillance vibe — a sound call for a product that watches everything you do. Tracker says done; the repo says the rollout branch never merged and the phone app still ships the old icons. A clean example of tracker state leading code state.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216782543496197","label":"Logo redesign: replace eye mark (surveillance vibe) + regenerate 4 store assets"}},"comments":5,"lastComment":"2026-07-21","sources":["Asana 1216782543496197","docs/audits/2026-07-21-SYNTHESIS.md NOW #8"]},{"id":"bug-docs-stale","label":"Docs Drift, No Freshness Gate","type":"bug","status":"broken","updatedAt":"2026-07-21","activity":"7/21: hardcoded v6.7.41 badge plus eight shipped features missing from the docs. No CI, no keyword-vs-changelog gate, no docs:check script.","blurb":"The docs site cannot tell when it is wrong. The badge fix is trivial — drive it from manifest.json like everything else already does — but the deeper problem is that nothing in the pipeline fails when documentation falls behind a release, so it always will.","links":{"md":"docs/audits/2026-07-21-SYNTHESIS.md"},"sources":["docs/audits/2026-07-21-SYNTHESIS.md NOW #7, OVERHAUL theme 6"]},{"id":"bug-version-drift","label":"Version Drift Across Channels","type":"bug","status":"broken","priority":"high","updatedAt":"2026-08-01","activity":"8/1: five different 'current' versions coexist — repo 6.7.82, staff channel 6.7.78, enterprise CRX 6.7.78, newest store zip 6.7.47, companion updater manifest desktop-v0.2.1 against a 0.3.10 release.","blurb":"Every distribution channel advertises a different version, and the companion's own updater points eight patches behind its published release. The repo has excellent internal version discipline (manifest.json as source of truth, a pre-commit sync gate) that stops at the moment of publication — nothing verifies that what shipped matches what the channels say shipped.","links":{"md":"docs/system-map/SYSTEM-MAP.md"},"sources":["live probes 2026-08-01","docs/audits/2026-07-21-SYNTHESIS.md NOW #8","site/desktop/latest.json"]},{"id":"goal-cws-publish","label":"GOAL: Publish to the Chrome Web Store","type":"milestone","status":"blocked","priority":"high","updatedAt":"2026-07-21","activity":"Blocked on human-only actions: developer registration, OAuth client creation, and console-only listing/visibility fields.","blurb":"The milestone that collapses three distribution channels into one and ends the self-hosted CRX archaeology. Everything an agent can build is built. What remains is a handful of clicks in two Google consoles that only Malkio can make — which is why this has sat still since mid-July while the code shipped 60 more versions.","links":{"md":"docs/CWS-PUBLISHING.md"},"sources":["docs/CWS-PUBLISHING.md §2","Asana 1216763466426648"]},{"id":"cortex-program","label":"Cortex Program","type":"plan","status":"in-progress","priority":"high","updatedAt":"2026-07-27","activity":"Plans 040-044 authored and largely shipped: capture I/O, dashboard, voice v0, self-correction, proactivity gate, controller attribution. Awaiting Malkio for the v7.0.0 cut.","blurb":"The ambient-intelligence layer: capture what the user actually did, observe it, and act. Fifteen C1-C15 feature specs across five phases, and the single largest body of planned work in the repo. CLAUDE.md still names it the current focus, with the v7.0.0 version bump gated on a manual regression pass Malkio has not yet run.","links":{"md":"docs/cortex/00-cortex-program-spec.md"},"sources":["docs/cortex/","docs/plans/plan-040..044","CLAUDE.md Project State"]},{"id":"capture-service","label":"Capture & Redaction","type":"capability","status":"live","updatedAt":"2026-07-10","activity":"701 lines: C1-C4 capture with fail-closed redaction, incognito fail-closed, window-targeted capture and partitioned Downloads writes. Confirmed working at 745 frames/day.","blurb":"Screenshot capture with redaction as the privacy floor — and it fails closed on every axis, which is the correct default for a tool that photographs your screen. The Save-As dialog problem was eliminated by routing writes through the companion or OPFS silently.","links":{"md":"docs/cortex/DATA-MAP.md"},"sources":["src/background/services/captureService.js","CLAUDE.md session log 2026-07-10"]},{"id":"cortex-proxy","label":"Cortex Proxy","type":"service","status":"partial","updatedAt":"2026-07-10","activity":"Function code deployed; CLAUDE.md's next-steps still list 'deploy cortex-proxy (set secret)' as outstanding.","blurb":"A server-held OpenAI key behind an edge function, so no model credential ever touches a client. Defaults to gpt-4o-mini with a 200KB payload cap. Partial because the secret provisioning is repeatedly listed as an unfinished handoff item.","links":{"md":"supabase/functions/cortex-proxy/index.ts"},"sources":["supabase/functions/cortex-proxy/index.ts","CLAUDE.md session log"]},{"id":"self-correction","label":"Self-Correction (C10)","type":"capability","status":"live","updatedAt":"2026-07-10","activity":"Nightly apply/revert loop shipped with context reconciliation (C10a); an Opus review caught and fixed a storage race before merge.","blurb":"The system proposing corrections to its own records overnight — mislabelled focuses, misattributed time — with an explicit revert path. Reversibility is what makes it safe to let software rewrite your timesheet.","links":{"md":"docs/cortex/WHAT-REMAINS.md"},"sources":["src/background/services/selfCorrectionService.js","src/background/services/contextReconcileService.js"]},{"id":"agent-sessions","label":"Agent Session Attribution (C11a)","type":"capability","status":"partial","updatedAt":"2026-07-20","activity":"7/20: intake corrected the record — C11a is merged to staging, no longer branch-only.","blurb":"Tracking which agent controller did what, so autonomous work is attributable rather than anonymous browsing noise. Shipped in core; the surfaces that would make it visible — agent-vs-human history, session aggregation — are still specs.","links":{"md":"docs/features/219-agent-vs-human-history.md"},"sources":["src/background/services/agentSessionService.js","Tabatha_Changelog.md v6.7.79"]},{"id":"voice-io","label":"Voice In/Out","type":"feature","status":"partial","updatedAt":"2026-07-25","activity":"7/25: voice audit ran; echo/barge-in discipline and STT provider routing filed as an open fix.","blurb":"Speak-instead-of-modal announcements, voice notes, and voice check-ins on the phone — shipped as v0 with no new permissions. Partial because the mic and the speaker fight: there is no barge-in discipline between input and TTS/chaperone output, so the system talks over itself.","links":{"md":"docs/features/211-audio-input-voice-control.md","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216901254646179","label":"FIX Voice echo — barge-in discipline (mic vs TTS/chaperone) + STT provider routing (ElevenLabs via proxy)"}},"comments":0,"sources":["src/services/voiceOutput.js","sidecar/src/lib/speech.ts","Asana 1216901254646179"]},{"id":"plan-045-agent","label":"Plan 045 — Agent Control Layer","type":"plan","status":"in-progress","priority":"high","updatedAt":"2026-07-27","activity":"7/26: Malkio chose the Headbox bridge, resolving the spec's open recommendation into a decision — harness lifecycle hooks as the event source, plus a reverse channel and agent-created backburner writes.","blurb":"The plan that makes Tabatha an attention OS for agents as well as humans: agent runs become tracked work surfaces, checkpoint prompts can be answered by a background agent, and run-complete notifications arrive inside Tabatha — gated by the same snooze / off-device / break rules so a finished agent run cannot puncture a protected focus block.","links":{"md":"docs/plans/plan-045-agent-control-layer.md","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216922197879721","label":"#220 addendum: harness hooks → Tabatha (reverse-channel notifications, agent backburner, Headbox bridge DECIDED)"}},"comments":0,"sources":["docs/plans/plan-045-agent-control-layer.md","Tabatha_Changelog.md v6.7.81"]},{"id":"mcp-server","label":"MCP Server (Plan 045 T1)","type":"plan","status":"planned","priority":"high","updatedAt":"2026-07-25","activity":"7/25: research concluded ChatGPT Voice exposes no API or extension point — but the ChatGPT desktop app, Codex CLI and Codex IDE extension share one MCP config, so the MCP server IS the integration.","blurb":"The sharpest strategic finding in the recent intake: rather than integrating with one vendor's voice product, ship an MCP server and every MCP-aware agent gets Tabatha for free. Turns a blocked vendor integration into a general capability. Records its own unverified assumption and the cheap test for it, which is unusually honest planning.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216901255842277","label":"GPT Voice / Codex integration = ship the MCP server (Plan 045 T1). No GPT Voice API exists; MCP is the surface."}},"comments":0,"sources":["Asana 1216901255842277","Tabatha_Changelog.md v6.7.80"]},{"id":"plan-220-session-agg","label":"#220 Session Aggregation","type":"plan","status":"planned","updatedAt":"2026-07-27","activity":"7/25: specced — a unified work-surfaces model (tab | OS window | harness session) attachable to a focus, with a CHECKPOINT_REQUEST hook and a 45s timeout falling back to the human.","blurb":"Unifies the three things that can constitute 'working on something' — a browser tab, an OS window, and an agent harness session — into one attachable model. This is the abstraction that would let the companion, extension and agent layer stop each having their own idea of what a work surface is.","links":{"md":"docs/features/220-session-aggregation-auto-updates.md"},"sources":["docs/features/220-session-aggregation-auto-updates.md"]},{"id":"taskrun-platform-review","label":"TaskRun Platform Review","type":"task","status":"in-progress","priority":"high","updatedAt":"2026-07-26","activity":"7/26: ten comments across a multi-agent orchestration — Torren (extension E2E), Vail (web E2E), Sable (sync forensics), Koda (adversarial verdicts), Dex, Corin, Wren.","blurb":"The 24-25 July full-platform review: seven named agents running live end-to-end testing in parallel, with a synthesis pass that promoted twelve NOW items and killed six findings as wrong or already fixed. This is the mechanism producing nearly every open wound on this map, and it is the most credible source of state in the whole system.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216867368858873","label":"TaskRun 2026-07-24/25 — Full platform review + live E2E testing (CeeCee orchestration)"},"md":"docs/audits/2026-07-21-SYNTHESIS.md"},"comments":10,"lastComment":"2026-07-26","sources":["Asana 1216867368858873","docs/audits/ (9 audit docs)"]},{"id":"flux-ecosystem","label":"Flux (parent ecosystem)","type":"integration","status":"live","priority":"high","updatedAt":"2026-08-01","activity":"8/1: confirmed structurally, not just narratively — the linked Supabase project is NAMED 'Flux', and Tabatha's tracker home is the 'Flux Development' Asana project.","blurb":"The portfolio calls Flux a sibling. The evidence says parent: Tabatha's entire backend is the Supabase project literally named Flux, its Asana home is Flux Development, and its checkpoint protocol posts project updates there by rule. Flux's internals are owned elsewhere — modelled here purely as the dependency it is. The roadmap's 'Phase 5: The Flux Ecosystem' is therefore mis-sequenced: the integration is not a future phase, it is the substrate.","links":{"web":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/","label":"Asana project board: Flux Development — Tabatha's real tracker home"}},"sources":["supabase/.temp/linked-project.json","CLAUDE.md Checkpoint Protocol §4","Asana project listing"]},{"id":"asana-integration","label":"Asana Task Sync","type":"integration","status":"partial","updatedAt":"2026-07-24","activity":"7/24: 6.7.72 added the extension-side PAT connect card, reaching parity with the Sidecar. Sync remains ONE-DIRECTIONAL by design.","blurb":"Connect a Personal Access Token and Asana tasks flow into Tabatha as linkable work, with subtasks and blockers, refreshed by pg_cron every five minutes and by webhook. Partial by explicit v1 scope: the function header states there is no mutation pushback, so completing work in Tabatha does not close it in Asana. Task URLs also auto-derive gate context, which is a genuinely nice touch.","links":{"md":"supabase/functions/sync-asana-tasks/index.ts","asana":{"url":"https://app.asana.com/1/9526911872029/project/1216275477769879/task/1216226128734333","label":"NB-06 Asana PAT integration — pull user's active/incomplete tasks, tie to intents (auto or optional)"}},"comments":1,"lastComment":"2026-07-01","sources":["supabase/functions/sync-asana-tasks/index.ts","Tabatha_Changelog.md v6.7.72"]},{"id":"flux-asana-widget","label":"flux-asana-widget","type":"integration","status":"partial","updatedAt":"2026-04-29","activity":"4/29: session log records 'full e2e test passing', with the next step 'Register app in Asana Developer Console' — no registration artifact exists in the repo.","blurb":"A standalone Express/HTTPS server implementing the Asana App Component protocol as an in-Asana time tracker, writing to public.flux_time_entries. Orphaned: outside the build, lint and test scope, superseded by the connect-asana / sync-asana-tasks edge functions, and it commits its own TLS private keys into the tree. The July system map recommends giving it its own 0.x version line rather than letting it ride the extension's.","links":{"md":"docs/WIDGET-VERSIONING.md"},"sources":["flux-asana-widget/","CLAUDE.md session log 2026-04-29","docs/system-map/SYSTEM-MAP.md §7.1"]},{"id":"mimir-connector","label":"Mimir Connector","type":"integration","status":"planned","updatedAt":"2026-07-27","activity":"7/27: designed as opt-in and non-blocking — notes push through the companion's local bridge, not the extension, so MV3 gains no loopback host permission.","blurb":"An opt-in sink pushing notes into Mimir, the ecosystem's memory layer. The design discipline is the interesting part: a missing Mimir is a no-op rather than an error, and Tabatha refuses rather than clamps — a note marked private is never pushed, because Mimir v1 hard-caps classification at internal.","links":{"md":"docs/features/222-notes-system.md"},"sources":["Tabatha_Changelog.md v6.7.81","ROADMAP.md Phase 5"]},{"id":"headbox","label":"Headbox (agent governance)","type":"integration","status":"live","priority":"high","updatedAt":"2026-07-29","activity":"Rule 10 bumps manifest.json on EVERY commit, which is why a 6.7.82 reformat of that one file would have conflicted across 20 active worktree branches.","blurb":"The standardized agent-instruction system governing how every agent works this repo — one CLAUDE.md/AGENTS.md/GEMINI.md, a plan registry, a parking lot, sticky notes, and per-commit version discipline. It is the reason 40 parallel worktrees do not collide, and the reason a formatting change in one file is treated as a release-blocking event.","links":{"md":"CLAUDE.md"},"sources":["CLAUDE.md",".headbox/","Tabatha_Changelog.md v6.7.82"]},{"id":"screensaver","label":"Refocus Screensaver Clock","type":"integration","status":"killed","updatedAt":"2026-07-19","activity":"7/19: system map lists it at v2.0.0, local install only, status 'Dormant'.","blurb":"An Electron screensaver clock in the Flux family, intended to receive the current focus and display it during idle time. Roadmap Phase 5 still lists the integration as planned; the surface inventory calls it dormant with no deployment. Superseded in practice by the Sidecar's Context View, which does the same ambient-display job on hardware people already own.","links":{"md":"docs/system-map/SYSTEM-MAP.md"},"sources":["docs/system-map/SYSTEM-MAP.md surface 6"]},{"id":"calendar-sync","label":"Calendar Sync (Plan 035)","type":"feature","status":"partial","updatedAt":"2026-07-16","activity":"Migration 014 created the calendar tables and syncService pushes events; the Google OAuth sync engine and calendar UI (Phases 2-3) remain an open, uncommented task.","blurb":"Time-blocking against a real calendar — the bridge between intended schedule and actual attention, and a prerequisite for meeting-block detection and auto-backfill. The data layer exists; the OAuth engine and the month/week/day UI do not. It also supplies the last rung of #221's evidence ladder for proposing a missed clock-in time.","links":{"md":"docs/Plan-035-time-blocking-calendar.md","asana":{"url":"https://app.asana.com/1/9526911872029/task/1216624026202925","label":"[Tabatha] Google Calendar integration — Plan 035 Phases 2-3 (UI + OAuth sync engine)"}},"comments":0,"sources":["supabase/migrations/014_create_calendar_sync_tables.sql","Asana 1216624026202925"]},{"id":"anasa-console","label":"Anasa Console Integration","type":"integration","status":"partial","updatedAt":"2026-07-25","activity":"7/25: T3.4a 'Tabatha display-only integration' marked complete — Tabatha appears in the Anasa console as a read-only tile.","blurb":"Tabatha surfacing inside Anasa, the workspace control plane. Display-only for now: the console can show Tabatha state but cannot drive it. A small integration whose significance is directional — it is the first time Tabatha appears as a component of something larger rather than a standalone tool.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/task/1216544708406414","label":"T3.4a - Tabatha display-only integration"}},"comments":0,"sources":["Asana 1216544708406414","Asana 1216498577887990"]},{"id":"system-status-map","label":"Daily System Status Survey","type":"task","status":"live","priority":"high","updatedAt":"2026-07-31","activity":"7/31: still posting. 22 comments and counting — an automated daily survey by Hermes that has run every single day since 2026-07-18 and is the freshest signal in the entire workspace.","blurb":"A daily automated release/branch/surface survey across the whole Tabatha family, posting to Asana. Marked complete in the tracker yet still commenting daily, which is exactly the tell that it is a recurring job rather than a task. Its 2026-07-19 output — docs/system-map/SYSTEM-MAP.md — is the most rigorous internal account of the version tangle that this atlas is built to replace.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216678592681467","label":"System Status Map — daily release/branch/surface map (Tabatha family)"},"md":"docs/system-map/SYSTEM-MAP.md"},"comments":22,"lastComment":"2026-07-31","sources":["Asana 1216678592681467","docs/system-map/SYSTEM-MAP.md"]},{"id":"repo-tabatha","label":"MrMalkio/tabatha","type":"repo","status":"live","priority":"high","updatedAt":"2026-07-29","activity":"614 commits from 2026-02-11 to 2026-07-29. Monthly histogram: Feb 3, Apr 11, May 185, Jun 51, Jul 364 — July was by far the most productive month in the repo's life.","blurb":"The monorepo: extension, sidecar, site, supabase, functions, scripts and store assets in one tree. HEAD is 6.7.82 on branch docs/intake-2026-07-25-agent-layer-bugs with a clean working tree. The June dip and July explosion track exactly with the Cortex program landing and the multi-agent taskrun cadence starting.","links":{"gh":{"url":"https://github.com/MrMalkio/tabatha","label":"MrMalkio/tabatha — extension, sidecar, site and backend monorepo"}},"comments":0,"sources":["git log/rev-list on C:/Users/mrmal/le dev/Tabatha"]},{"id":"repo-desktop","label":"MrMalkio/tabatha-desktop","type":"repo","status":"live","updatedAt":"2026-07-23","activity":"40 commits, 2026-05-10 to 2026-07-23; 31 of them in July. Working tree dirty (6 files). Default remote HEAD points at feat/code-signing, not master.","blurb":"The Tauri companion's private source repo — releases are published to the public tabatha mirror instead. Seven feature branches alive at once for a 40-commit repo, which says the work is exploratory rather than trunk-based. That the remote default branch is feat/code-signing is itself a small signal that release hygiene is unsettled.","links":{"gh":{"url":"https://github.com/MrMalkio/tabatha-desktop","label":"MrMalkio/tabatha-desktop — Tauri companion source"}},"comments":0,"sources":["git log/branch on C:/Users/mrmal/le dev/tabatha-desktop"]},{"id":"repo-watch","label":"MrMalkio/tabatha-watch","type":"repo","status":"working","updatedAt":"2026-07-24","activity":"8 commits, 2026-07-18 to 2026-07-24 — the entire repo is six days old and then stops. Checked out on fix/watch-0.2.1-polish, not main.","blurb":"The newest surface in the family, built in under a week from nothing to a paired, tiled, unit-tested Wear OS app. Marked working rather than live because it has had no commits since 24 July, sits on an unmerged polish branch, and has no release artifact — a strong start whose second week never came.","links":{"gh":{"url":"https://github.com/MrMalkio/tabatha-watch","label":"MrMalkio/tabatha-watch — Wear OS companion"}},"comments":0,"sources":["git log/branch on C:/Users/mrmal/le dev/tabatha-watch"]},{"id":"repo-mobile-1","label":"MrMalkio/tabatha-mobile","type":"repo","status":"killed","updatedAt":"2026-05-30","activity":"19 commits, every one in May 2026, last 2026-05-30. Zero commits in June or July while the rest of the family shipped 400+.","blurb":"Dead for two months and counting. Its final commits — orphan session recovery, native build errors, auth debugging — read like a project fighting its toolchain rather than building features, which is usually how Expo-with-native-modules efforts end.","links":{"gh":{"url":"https://github.com/MrMalkio/tabatha-mobile","label":"MrMalkio/tabatha-mobile — abandoned Expo mobile attempt"}},"comments":0,"sources":["git log month histogram on C:/Users/mrmal/le dev/tabatha-mobile"]},{"id":"repo-mobile-2","label":"MrMalkio/tabatha-mobile-2","type":"repo","status":"killed","updatedAt":"2026-05-30","activity":"6 commits, all on 2026-05-30 between 13:12 and 21:51. A single-day repository.","blurb":"Born and abandoned in nine hours. Not a serious second mobile bid — an AI Studio scaffold that pivoted to a design lab by its own final commit message. Treating it as a 'competing mobile codebase' overstates it by a wide margin; the audit document it produced outlived the code.","links":{"gh":{"url":"https://github.com/MrMalkio/tabatha-mobile-2","label":"MrMalkio/tabatha-mobile-2 — one-day Android scaffold, now a design lab"}},"comments":0,"sources":["git log on C:/Users/mrmal/le dev/tabatha-mobile-2"]},{"id":"repo-codex","label":"Tabatha-codex (empty)","type":"repo","status":"killed","updatedAt":"2026-05-18","activity":"Directory exists and is completely empty — not a git repository, no hidden files. Last touched 2026-05-18.","blurb":"An empty husk. Listed in the July system map among 'legacy/experiment clones outside the worktree system, likely archive'. Worth a node purely so nobody wastes another hour wondering whether it holds unlanded work: it holds nothing.","links":{"md":"docs/system-map/SYSTEM-MAP.md"},"sources":["ls -la C:/Users/mrmal/le dev/Tabatha-codex"]},{"id":"repo-sync-batch","label":"Tabatha-sync-batch-1 (dead worktree)","type":"repo","status":"killed","updatedAt":"2026-05-18","activity":"Has a .git FILE rather than a directory — a detached worktree pointer whose target no longer resolves ('fatal: not a git repository: (NULL)').","blurb":"A broken worktree left over from the May Supabase sync batch, frozen at the v4.0.0 era. Its content is superseded — migrations 008 onward all live in the monorepo now — but the directory still sits in the workspace looking like a real codebase, which is exactly the kind of thing this map exists to disarm.","links":{"md":"docs/system-map/SYSTEM-MAP.md"},"sources":["git status on C:/Users/mrmal/le dev/Tabatha-sync-batch-1"]},{"id":"worktree-fleet","label":"40-Worktree Parallel Fleet","type":"infra","status":"working","priority":"high","updatedAt":"2026-07-29","activity":"40 worktrees under .claude/worktrees/ and 20+ local branches, spanning sidecar lanes, epics, audits, fixes and site work.","blurb":"The engine behind July's 364 commits: many agents working isolated worktrees against zone-ownership rules from the parallel-development workflow doc. It is also the single largest source of confusion in the system — the July system map's top risk was that the one dist/ folder Chrome loads had been built from an unmerged branch nobody intended to run.","links":{"md":"docs/parallel-development-workflow.md"},"sources":[".claude/worktrees/ (40 dirs)","git branch -a","docs/system-map/SYSTEM-MAP.md §1"]},{"id":"branch-update-channel","label":"update-channel (orphan branch)","type":"branch","status":"live","updatedAt":"2026-07-25","activity":"Holds nothing but latest.json, currently 6.7.78. Committed with --no-verify by design, since the shared pre-commit version gate has nothing to resolve there.","blurb":"An orphan branch used as a static file host — a neat, cheap CDN for the staff auto-update manifest, served forever from raw.githubusercontent.com. The one place in the repo where skipping the pre-commit hook is the correct call, and the docs explain exactly why.","links":{"md":"docs/OPERATIONS.md"},"sources":["docs/OPERATIONS.md §2.2","git branch -a"]},{"id":"branch-staging","label":"staging / main trunks","type":"branch","status":"partial","updatedAt":"2026-07-18","activity":"7/18: PRs #27-#31 explicitly titled 'restore' reconciled a divergence where origin/staging sat at 6.6.0 while local staging held an entire unpushed 6.7.x run.","blurb":"The trunks, and a cautionary tale. For a stretch in July GitHub was NOT the source of truth for the extension — the whole 6.6.0 to 6.7.8 run existed only locally, and it took five restore PRs in twenty minutes to put it back. Marked partial because the working line today is an intake branch, not staging.","links":{"gh":{"url":"https://github.com/MrMalkio/tabatha/pull/27","label":"PR #27 — restore: reconcile local staging (6.7.x extension run) with origin/staging (sidecar line)"}},"comments":0,"sources":["GitHub PRs #27-#31","docs/system-map/SYSTEM-MAP.md §1"]},{"id":"version-discipline","label":"Version & Changelog Gate","type":"capability","status":"live","updatedAt":"2026-07-29","activity":"manifest.json is the single source of truth; prebuild runs sync-version.mjs plus a changelog drift check, enforced by a pre-commit hook.","blurb":"Unusually strong internal release hygiene: one source of truth, a script that propagates it, and a build that refuses to proceed if the changelog has drifted. This is precisely why the external drift is so striking — the discipline is rigorous right up to the moment of publication, and then stops.","links":{"md":"scripts/sync-version.mjs"},"sources":["package.json prebuild","scripts/sync-version.mjs","CLAUDE.md Headbox Rule 10"]},{"id":"dist-archives","label":"Stale dist-v* Archives","type":"infra","status":"killed","updatedAt":"2026-05-29","activity":"Six checked-in build outputs: dist-v3.34.5, v4.0.0, v4.3.1, v4.3.6, v5.8.0, v6.0.0. Newest is dated 2026-05-29.","blurb":"The version ladder as sediment. These are the builds that made the workspace portfolio think the product was at v4.x — but the newest is 6.0.0 from May, two months and eighty versions behind. The July system map calls them archives to ignore and candidates for cleanup; they are load-bearing only as archaeology.","links":{"md":"docs/system-map/SYSTEM-MAP.md"},"sources":["ls -d dist-v* in C:/Users/mrmal/le dev/Tabatha","docs/system-map/SYSTEM-MAP.md §4"]},{"id":"env-cf-pages","label":"Cloudflare Pages `tabatha`","type":"env","status":"live","updatedAt":"2026-08-01","activity":"8/1: both tabatha.pages.dev and the custom domain tabatha.pondocean.co return 200.","blurb":"Hosts the marketing site, docs, showcase, download page, enterprise CRX channel and the Pages Functions API, deployed by a single npm script pinned to the main branch. The one deploy-hygiene gap the operations doc self-flags is that the docs sub-deploy omits --branch=main, risking a preview deploy.","links":{"web":{"url":"https://tabatha.pondocean.co","label":"Cloudflare Pages project `tabatha` — live"}},"sources":["live curl probes 2026-08-01","package.json site:deploy","docs/OPERATIONS.md"]},{"id":"surface-inventory-doc","label":"SYSTEM-MAP.md (internal)","type":"plan","status":"partial","updatedAt":"2026-07-19","activity":"Generated 2026-07-19 by Hermes; already superseded on most specifics (it lists sidecar 0.2.1, companion 0.2.1, migrations at 033, extension prod 6.7.22).","blurb":"The best internal attempt at this atlas's job: a surface inventory, claimed-vs-verified table, per-branch action table and worktree map. Its method is excellent and its facts are two weeks stale, which is the exact failure mode a living map is meant to fix. Kept as a node because it is the benchmark this instance has to beat.","links":{"md":"docs/system-map/SYSTEM-MAP.md"},"sources":["docs/system-map/SYSTEM-MAP.md"]},{"id":"roadmap-doc","label":"ROADMAP.md (stale)","type":"plan","status":"partial","updatedAt":"2026-07-27","activity":"7/27: gained a Phase 3.5 (Notes V1) and a Mimir entry — while still listing 'Tabatha Desktop Companion (Electron/Tauri)' as unbuilt Phase 6 work at v4.0.","blurb":"Partially maintained and structurally wrong. It marks Phase 1 as 'Current' and puts the desktop companion in a future Phase 6 — a companion that has been shipping since May and is on its tenth 0.3.x patch. New entries get appended faithfully while the completed phases are never reconciled, so it reads as a plan for a product two major versions younger than the one that exists.","links":{"md":"ROADMAP.md"},"sources":["ROADMAP.md","Tabatha_Changelog.md v6.7.81"]},{"id":"portfolio-doc","label":"tabatha-portfolio.md (stale)","type":"plan","status":"broken","updatedAt":"2026-07-25","activity":"Describes the Gatekeeper as a new-tab intercept, claims 'React Migration Complete' as the status, lists Phase 2 as in progress, and names Flux a sibling.","blurb":"The workspace-facing portfolio entry, and the least accurate document in the set. Nearly every load-bearing claim is wrong: the Gatekeeper is not the new-tab override, Flux is not a sibling, desktop integration is not a future Phase 5, and there is no mention of the sidecar, the watch, the three distribution channels, or the org/team layer. Marked broken rather than partial because a reader would come away with a materially false model of the product.","links":{"md":"tabatha-portfolio.md"},"sources":["C:/Users/mrmal/le dev/tabatha-portfolio.md","cross-checked against public/manifest.json and git HEAD"]}],"edges":[{"from":"gatekeeper","to":"sw-background","kind":"depends"},{"from":"gatekeeper","to":"bg-services","kind":"depends"},{"from":"gate-friction","to":"gatekeeper","kind":"part-of"},{"from":"context-inheritance","to":"gatekeeper","kind":"depends"},{"from":"context-inheritance","to":"focus-engine","kind":"depends"},{"from":"blockgate","to":"sw-background","kind":"depends"},{"from":"blockgate","to":"bg-services","kind":"depends"},{"from":"inbar","to":"sw-background","kind":"depends"},{"from":"inbar","to":"focus-engine","kind":"depends"},{"from":"inbar","to":"voice-io","kind":"depends"},{"from":"url-rules","to":"bg-services","kind":"depends"},{"from":"url-rules","to":"gatekeeper","kind":"affects","detail":"Benign by design: a matching URL rule sets contextSource='url_rule' and the gate is skipped entirely. Severity low. First seen: Plan 038 (2026-07-20). This is the intended pressure valve, but it means a mis-scoped rule silently disables intentional friction for a whole domain with no user-visible signal that the gate was suppressed."},{"from":"agent-human-toggle","to":"gatekeeper","kind":"part-of"},{"from":"agent-human-toggle","to":"agent-sessions","kind":"depends"},{"from":"inpop-header","to":"inbar","kind":"depends"},{"from":"goal-intentional-friction","to":"gatekeeper","kind":"depends"},{"from":"goal-intentional-friction","to":"inbar","kind":"depends"},{"from":"goal-intentional-friction","to":"blockgate","kind":"depends"},{"from":"bug-xss-sinks","to":"gatekeeper","kind":"affects","detail":"Four unescaped innerHTML sites in gatekeeper.js (:255,:265,:274,:297 — only :297 gets quote-only escaping). Severity HIGH. First seen: 2026-07-21 audit, re-verified worse than reported. Any focus label or inherited context containing markup renders as live HTML inside the gate. Workaround: none in place — no escapeHtml() helper exists anywhere in src/."},{"from":"bug-xss-sinks","to":"inbar","kind":"affects","detail":"About 19 unescaped sites in inbar.js, including notes and descriptions rendered raw inside a <textarea> (:564,:601), the edit-dropdown focus list (:588→594), sticky-note pause text (:680/681), and nine auto-triggered overlay sites (:1258–:1608). Severity HIGH. First seen: 2026-07-21. Workaround: none. Fixing the textarea sinks needs care to preserve legitimate newlines."},{"from":"bug-xss-sinks","to":"rls-policies","kind":"affects","detail":"The escalation path: migration 012's manager/team RLS scoping makes focus_items.label and checkpoint notes readable cross-user TODAY, so a malicious label written on one device renders unescaped in a manager's browser. Severity HIGH — this reclassifies the bug from self-XSS to genuine cross-user XSS. First seen: reclassified 2026-07-21. Workaround: none; RLS is working as designed, the sinks are the defect."},{"from":"bug-break-notes","to":"clock-shifts","kind":"affects","detail":"Break notes typed by the user are written to local React state only and silently discarded — the code comment says 'In production this would persist via sendMessage.' Severity MED, trust-critical: unlike its siblings this control is not badged 'SOON', so it presents as working. First seen: 2026-07-21 (Argus W1). Workaround: add the existing stub badge until real persistence lands."},{"from":"bug-b09-inbar","to":"inbar","kind":"affects","detail":"Two broken paths on the most-used surface: clicking a focus in the edit dropdown sends only SWITCH_FOCUS and discards the typed name; pressing Save triggers autoQueueFromIntent, which severs the link just made and spawns a stray queued sub-focus. Severity MED-HIGH. First seen: root-caused 2026-07-25 (6.7.79). Workaround: none — fix shape and acceptance criteria are specced but unimplemented."},{"from":"bug-b09-inbar","to":"focus-engine","kind":"affects","detail":"The stray sub-focus that B09 spawns is a real row in the focus tree, so the corruption outlives the InBar interaction and pollutes the queue and history. Severity MED. First seen: 2026-07-25. Workaround: manually resolve the orphan sub-focus."},{"from":"bug-clock-backdate","to":"clock-shifts","kind":"affects","detail":"A missed clock-in cannot be corrected at all: clockIn()/clockOut() take no arguments and hardcode new Date(), the handlers ignore any payload, and no EDIT_SHIFT handler exists. Severity HIGH for anyone billing against this data — the hours are simply lost. First seen: confirmed 2026-07-25 (#221). Workaround: none."},{"from":"bug-clock-backdate","to":"surface-workshifts","kind":"affects","detail":"Work Shifts' '✏️ Edit Shift' renders as a disabled stub with a SOON badge, so the surface that should own shift correction advertises the capability without providing it. Severity MED. First seen: 2026-07-21. Workaround: none."},{"from":"plan-221-clock","to":"bug-clock-backdate","kind":"plans"},{"from":"plan-221-clock","to":"clock-shifts","kind":"plans"},{"from":"bug-elapsed-drift","to":"focus-lifecycle","kind":"affects","detail":"RESOLVED (6.7.71/6.7.73). While open, an active focus's elapsed time was undercounted by exactly its accumulated pause time on every surface except the extension, worsening with each pause/resume cycle. Severity was HIGH — it silently understated tracked work. First seen: reported by Malkio as 'syncing between surfaces still a little off'; fixed 2026-07-24 with a red-to-green unit test."},{"from":"focus-lifecycle","to":"focus-engine","kind":"part-of"},{"from":"checkpoints","to":"focus-engine","kind":"depends"},{"from":"checkpoints","to":"schema-tabatha","kind":"depends"},{"from":"backburner","to":"focus-engine","kind":"depends"},{"from":"focus-queue","to":"focus-engine","kind":"depends"},{"from":"sub-intents","to":"focus-engine","kind":"depends"},{"from":"clock-shifts","to":"bg-services","kind":"depends"},{"from":"clock-shifts","to":"sync-service","kind":"depends"},{"from":"surface-workshifts","to":"clock-shifts","kind":"depends"},{"from":"surface-activity","to":"clock-shifts","kind":"depends"},{"from":"unified-timeline","to":"os-focus-tracking","kind":"depends"},{"from":"unified-timeline","to":"clock-shifts","kind":"depends"},{"from":"auto-focus","to":"focus-engine","kind":"depends"},{"from":"auto-focus","to":"url-rules","kind":"depends"},{"from":"off-device","to":"focus-engine","kind":"depends"},{"from":"focus-engine","to":"bg-services","kind":"part-of"},{"from":"bg-services","to":"sw-background","kind":"part-of"},{"from":"surface-home","to":"sw-background","kind":"depends"},{"from":"surface-home","to":"unified-timeline","kind":"depends"},{"from":"surface-sidebar","to":"sw-background","kind":"depends"},{"from":"surface-sidebar","to":"focus-engine","kind":"depends"},{"from":"surface-popup","to":"sw-background","kind":"depends"},{"from":"surface-settings","to":"sw-background","kind":"depends"},{"from":"settings-live-preview","to":"surface-settings","kind":"part-of"},{"from":"feedback-widget","to":"edge-functions","kind":"depends"},{"from":"feedback-widget","to":"asana-integration","kind":"depends"},{"from":"hotkeys","to":"sw-background","kind":"depends"},{"from":"notes-system","to":"surface-sidebar","kind":"depends"},{"from":"notes-system","to":"desktop-companion","kind":"depends"},{"from":"notes-system","to":"schema-tabatha","kind":"depends"},{"from":"test-suite","to":"repo-tabatha","kind":"part-of"},{"from":"schema-tabatha","to":"supabase-backend","kind":"part-of"},{"from":"rls-policies","to":"schema-tabatha","kind":"part-of"},{"from":"edge-functions","to":"supabase-backend","kind":"part-of"},{"from":"fn-pair-watch","to":"edge-functions","kind":"part-of"},{"from":"fn-push","to":"edge-functions","kind":"part-of"},{"from":"cortex-proxy","to":"edge-functions","kind":"part-of"},{"from":"sync-service","to":"supabase-backend","kind":"depends"},{"from":"sync-service","to":"auth-identity","kind":"depends"},{"from":"sync-service","to":"cloud-outbox","kind":"depends"},{"from":"cloud-outbox","to":"sw-background","kind":"depends"},{"from":"data-rehydrate","to":"sync-service","kind":"depends"},{"from":"realtime","to":"supabase-backend","kind":"depends"},{"from":"auth-identity","to":"supabase-backend","kind":"depends"},{"from":"device-management","to":"rls-policies","kind":"depends"},{"from":"device-management","to":"auth-identity","kind":"depends"},{"from":"invites","to":"schema-tabatha","kind":"depends"},{"from":"org-teams","to":"rls-policies","kind":"depends"},{"from":"org-teams","to":"clock-shifts","kind":"depends"},{"from":"fn-push","to":"schema-tabatha","kind":"depends"},{"from":"bug-rls-revoke","to":"device-management","kind":"affects","detail":"A revoked session's still-valid JWT can call the Supabase REST API directly, bypassing the extension UI, and clear its own revoked_at — defeating remote sign-out for that device. Scope is same-profile only, not arbitrary cross-user. Severity HIGH. First seen: 2026-07-21, re-confirmed still open after the 6.7.54 application-code fix. Workaround: the extension honours revocation; only a direct API caller can bypass it."},{"from":"bug-rls-revoke","to":"rls-policies","kind":"affects","detail":"Migration 016 ships a bare USING/WITH CHECK on profile_id with no session-identity test, and migration 045 explicitly notes no policy change was made for its new device columns. Severity HIGH — the guarantee lives in application code only. First seen: 2026-07-21. Workaround: none; fix is a WITH CHECK clause or a BEFORE UPDATE trigger, sized S."},{"from":"bug-sync-root-a","to":"sync-service","kind":"affects","detail":"Cross-surface conflicts are arbitrated purely by recency, so the last writer wins regardless of whether it had current state. Severity HIGH — this is the architectural root beneath every 'sync is a little off' report. First seen: named in the 2026-07-24 sync forensics. Workaround: none; needs plan #047, which has a reserved number and no document."},{"from":"bug-sync-root-a","to":"data-rehydrate","kind":"affects","detail":"Compounding factor: the only two cloud-to-local pulls run ONCE per install and are gated by stored timestamps, so a device that drifts after its first pull has no repair path and stays wrong indefinitely. Severity HIGH. First seen: 2026-07-24. Workaround: reinstall, which clears the gate flags."},{"from":"bug-sync-root-d","to":"clock-shifts","kind":"affects","detail":"Shift rows are keyed by an ID hashed from their own clock times, so clock adoption across devices inserts a duplicate shift instead of updating the existing one. Severity HIGH — it double-counts hours. First seen: named 2026-07-24/25. Workaround: manually delete duplicate shift rows."},{"from":"bug-sync-root-d","to":"plan-221-clock","kind":"affects","detail":"Hard blocker on the clock-backdate feature: editing a shift time changes the hash the sync ID is derived from, so any edit would create a duplicate row rather than update one. Severity HIGH as a sequencing constraint. First seen: flagged inside the #221 spec itself. Workaround: land an immutable session id before building any time editing."},{"from":"plan-047-sync","to":"bug-sync-root-a","kind":"plans"},{"from":"plan-047-sync","to":"sync-service","kind":"plans"},{"from":"corin-sync-integrity","to":"sync-service","kind":"plans"},{"from":"desktop-companion","to":"ws-bridge","kind":"depends"},{"from":"desktop-companion","to":"os-focus-tracking","kind":"part-of"},{"from":"os-focus-tracking","to":"desktop-companion","kind":"depends"},{"from":"ws-bridge","to":"sw-background","kind":"depends"},{"from":"ws-handshake","to":"ws-bridge","kind":"plans"},{"from":"desktop-capture","to":"desktop-companion","kind":"part-of"},{"from":"desktop-capture","to":"capture-service","kind":"depends"},{"from":"desktop-updater","to":"desktop-companion","kind":"part-of"},{"from":"desktop-code-signing","to":"desktop-companion","kind":"plans"},{"from":"companion-parity-gap","to":"desktop-companion","kind":"plans"},{"from":"companion-parity-gap","to":"goal-surface-parity","kind":"plans"},{"from":"unified-timeline","to":"desktop-companion","kind":"depends"},{"from":"sidecar-pwa","to":"supabase-backend","kind":"depends"},{"from":"sidecar-pwa","to":"realtime","kind":"depends"},{"from":"sidecar-pwa","to":"fn-push","kind":"depends"},{"from":"sidecar-pwa","to":"focus-engine","kind":"depends"},{"from":"sidecar-context-view","to":"sidecar-pwa","kind":"part-of"},{"from":"phone-focus-mode","to":"sidecar-pwa","kind":"part-of"},{"from":"watch-app","to":"fn-pair-watch","kind":"depends"},{"from":"watch-app","to":"supabase-backend","kind":"depends"},{"from":"watch-pairing","to":"watch-app","kind":"part-of"},{"from":"watch-pairing","to":"sidecar-pwa","kind":"depends"},{"from":"watch-tile","to":"watch-app","kind":"part-of"},{"from":"watch-app","to":"focus-lifecycle","kind":"depends"},{"from":"checkpoints","to":"watch-app","kind":"affects","detail":"Benign, recorded for blast-radius honesty: the watch is a first-class checkpoint WRITER, so any change to checkpoint shape or the focus_checkpoints table breaks a surface that has no auto-update path and no release artifact. Severity LOW today, MED on schema change. First seen: watch 0.1.0 (2026-07-18). Workaround: treat checkpoint schema as a public contract."},{"from":"bug-watch-crash","to":"watch-app","kind":"affects","detail":"RESOLVED in 0.2.1 (2026-07-23). While open, every repository call in SupabaseFocusRepository was unguarded, so any connectivity failure crashed the whole watch app — pause, resume, extend, resolve and checkpoint all took the process down. Severity was CRITICAL and it was named a ship-blocker for any watch release. Fixed by wrapping every call site in runCatching."},{"from":"bug-assign-intent-deadend","to":"desktop-companion","kind":"affects","detail":"Assigning an OS window to an intent appears to work but never feeds time totals, so the companion records work that is silently discarded. Severity MED and trust-critical — a feature that looks like it tracks and does not is worse than an absent one. First seen: 2026-07-21. Workaround: none; deliberately escalated as a product-communication decision rather than silently patched."},{"from":"bug-assign-intent-deadend","to":"clock-shifts","kind":"affects","detail":"Downstream consequence: desktop time assigned to an intent never reaches the hours that Work Shifts and Org Hours aggregate, so any total computed from companion assignments understates real work. Severity MED. First seen: 2026-07-21. Workaround: clock and focus through the extension or sidecar instead."},{"from":"mobile-expo-legacy","to":"supabase-backend","kind":"depends"},{"from":"mobile-expo-legacy","to":"repo-mobile-1","kind":"part-of"},{"from":"mobile-android-lab","to":"repo-mobile-2","kind":"part-of"},{"from":"sidecar-pwa","to":"mobile-expo-legacy","kind":"affects","detail":"Supersession, not degradation: Tabby Sidecar took over the phone surface in July 2026 and both standalone mobile repos have been dead since 2026-05-30. Severity LOW as a defect, HIGH as a navigation hazard — two full repos with READMEs, plans and feature backlogs sit in the workspace looking live. First seen: divergence visible from the commit histograms. Workaround: archive both repos."},{"from":"goal-surface-parity","to":"sidecar-pwa","kind":"depends"},{"from":"goal-surface-parity","to":"desktop-companion","kind":"depends"},{"from":"goal-surface-parity","to":"watch-app","kind":"depends"},{"from":"goal-surface-parity","to":"surface-sidebar","kind":"depends"},{"from":"goal-surface-parity","to":"sync-service","kind":"depends"},{"from":"site-marketing","to":"env-cf-pages","kind":"depends"},{"from":"showcase-show","to":"site-marketing","kind":"part-of"},{"from":"docs-site","to":"site-marketing","kind":"part-of"},{"from":"download-page","to":"site-marketing","kind":"part-of"},{"from":"download-page","to":"invites","kind":"depends"},{"from":"waitlist","to":"cf-pages-functions","kind":"depends"},{"from":"cf-pages-functions","to":"env-cf-pages","kind":"depends"},{"from":"channel-staff","to":"repo-tabatha","kind":"depends"},{"from":"channel-staff","to":"branch-update-channel","kind":"depends"},{"from":"channel-enterprise","to":"env-cf-pages","kind":"depends"},{"from":"channel-cws","to":"store-assets","kind":"depends"},{"from":"channel-cws","to":"repo-tabatha","kind":"depends"},{"from":"cws-deployment-task","to":"channel-cws","kind":"plans"},{"from":"goal-cws-publish","to":"channel-cws","kind":"depends"},{"from":"goal-cws-publish","to":"store-assets","kind":"depends"},{"from":"logo-redesign","to":"store-assets","kind":"depends"},{"from":"store-assets","to":"showcase-show","kind":"depends"},{"from":"desktop-updater","to":"env-cf-pages","kind":"depends"},{"from":"bug-docs-stale","to":"docs-site","kind":"affects","detail":"The version badge is hardcoded (v6.7.41) and eight shipped features are missing or stale across four pages — device management, extension-minted pairing codes, count direction/precision, un-resolve, phone-away heartbeat semantics, invites, TV sign-in and the PWA orientation fix. Severity MED. First seen: 2026-07-21. Workaround: none — and no freshness-check mechanism exists at all, so this recurs on every release."},{"from":"bug-version-drift","to":"channel-staff","kind":"affects","detail":"The staff channel advertises 6.7.78 while the repo is at 6.7.82 — every staff install is four versions behind HEAD, including the 6.7.79-6.7.82 intake work. Severity MED. First seen: probed 2026-08-01. Workaround: run npm run publish:update; it is one command and fully automated."},{"from":"bug-version-drift","to":"channel-enterprise","kind":"affects","detail":"The enterprise update.xml serves 6.7.78 to force-installed Workspace machines, so the managed fleet is also four versions behind. Severity MED. First seen: probed 2026-08-01. Workaround: the CRX pack-and-publish sequence in OPERATIONS.md §2.2b — manual, undocumented until archaeology found it, and unautomated in scripts/."},{"from":"bug-version-drift","to":"desktop-updater","kind":"affects","detail":"site/desktop/latest.json still points at desktop-v0.2.1 while desktop-v0.3.10 is the published release — the in-app updater will not offer eight patches' worth of fixes, including the 0.3.9 confirmation dialogs and the 0.3.10 update-check feedback. Severity MED-HIGH: users who need the update-visibility fix cannot receive it through the mechanism that fix repairs. First seen: 2026-08-01. Workaround: manual download from the GitHub release."},{"from":"bug-version-drift","to":"store-assets","kind":"affects","detail":"The newest store zip is 6.7.47, 35 versions behind HEAD, and the screenshots were generated from the showcase at roughly 6.7.18. Severity LOW while unpublished, but it becomes a launch blocker the moment the CWS item goes live. First seen: 2026-08-01. Workaround: rerun build:store and capture:showcase before submission."},{"from":"bug-version-drift","to":"goal-cws-publish","kind":"affects","detail":"Sequencing hazard: the audit is explicit that version and logo reconciliation must happen BEFORE any store submission, not after, and that the RLS revoke gap should close first too. Severity MED as a release-gate. First seen: 2026-07-21 (NOW #8). Workaround: sequence reconciliation ahead of submission."},{"from":"cortex-program","to":"capture-service","kind":"plans"},{"from":"cortex-program","to":"self-correction","kind":"plans"},{"from":"cortex-program","to":"agent-sessions","kind":"plans"},{"from":"capture-service","to":"bg-services","kind":"depends"},{"from":"capture-service","to":"desktop-capture","kind":"depends"},{"from":"cortex-proxy","to":"supabase-backend","kind":"depends"},{"from":"self-correction","to":"cortex-proxy","kind":"depends"},{"from":"self-correction","to":"focus-engine","kind":"depends"},{"from":"agent-sessions","to":"bg-services","kind":"depends"},{"from":"voice-io","to":"cortex-proxy","kind":"depends"},{"from":"plan-045-agent","to":"agent-sessions","kind":"plans"},{"from":"plan-045-agent","to":"headbox","kind":"depends"},{"from":"mcp-server","to":"plan-045-agent","kind":"part-of"},{"from":"plan-220-session-agg","to":"plan-045-agent","kind":"part-of"},{"from":"plan-220-session-agg","to":"unified-timeline","kind":"plans"},{"from":"taskrun-platform-review","to":"repo-tabatha","kind":"plans"},{"from":"supabase-backend","to":"flux-ecosystem","kind":"part-of"},{"from":"asana-integration","to":"edge-functions","kind":"depends"},{"from":"asana-integration","to":"surface-settings","kind":"depends"},{"from":"flux-asana-widget","to":"supabase-backend","kind":"depends"},{"from":"flux-asana-widget","to":"asana-integration","kind":"affects","detail":"Duplication hazard rather than a live failure: the widget writes public.flux_time_entries on its own Express server while the edge functions own the tabatha schema, so two independent Asana time paths exist with no reconciliation. Severity LOW while dormant, MED if it is ever restarted. First seen: superseded around 2026-07. Workaround: retire the widget or give it its own 0.x line as the system map recommends. Note it also commits TLS private keys into the tree."},{"from":"mimir-connector","to":"notes-system","kind":"depends"},{"from":"mimir-connector","to":"desktop-companion","kind":"depends"},{"from":"headbox","to":"repo-tabatha","kind":"part-of"},{"from":"calendar-sync","to":"schema-tabatha","kind":"depends"},{"from":"calendar-sync","to":"plan-221-clock","kind":"affects","detail":"Dependency gap: calendar is the last rung of #221's evidence ladder for proposing a missed clock-in time, but the Google OAuth sync engine was never built, so that rung is unavailable. Severity LOW — the higher-confidence rungs (companion OS activity, first focus, capture frame, tab activity) all exist. First seen: 2026-07-25. Workaround: rely on the earlier rungs."},{"from":"anasa-console","to":"supabase-backend","kind":"depends"},{"from":"screensaver","to":"flux-ecosystem","kind":"part-of"},{"from":"sidecar-context-view","to":"screensaver","kind":"affects","detail":"Supersession: the Context View delivers the ambient focus-display job the Refocus screensaver was meant to do, on hardware the user already owns, which is why the screensaver went dormant at v2.0.0 with a local-only install. Severity LOW. First seen: Context View shipped 2026-07-18. Workaround: none needed — but ROADMAP.md Phase 5 still lists the screensaver integration as planned work, which is now misleading."},{"from":"system-status-map","to":"repo-tabatha","kind":"plans"},{"from":"flux-ecosystem","to":"asana-integration","kind":"depends"},{"from":"worktree-fleet","to":"repo-tabatha","kind":"part-of"},{"from":"branch-update-channel","to":"repo-tabatha","kind":"part-of"},{"from":"branch-staging","to":"repo-tabatha","kind":"part-of"},{"from":"version-discipline","to":"repo-tabatha","kind":"part-of"},{"from":"dist-archives","to":"repo-tabatha","kind":"part-of"},{"from":"desktop-companion","to":"repo-desktop","kind":"part-of"},{"from":"watch-app","to":"repo-watch","kind":"part-of"},{"from":"sidecar-pwa","to":"repo-tabatha","kind":"part-of"},{"from":"site-marketing","to":"repo-tabatha","kind":"part-of"},{"from":"schema-tabatha","to":"repo-tabatha","kind":"part-of"},{"from":"env-cf-pages","to":"repo-tabatha","kind":"depends"},{"from":"worktree-fleet","to":"version-discipline","kind":"affects","detail":"Forty concurrent worktrees all bump public/manifest.json on every commit (Headbox Rule 10), making it the repo's highest-contention shared file — a whole-file reformat would have forced a 98-line conflict onto 20 active branches, which is exactly why 6.7.82 exists as a revert. Severity MED as sustained friction. First seen: 2026-07-29. Workaround: keep the file at 2-space, the format the tooling already writes."},{"from":"worktree-fleet","to":"bug-version-drift","kind":"affects","detail":"Root cause of the drift: with 40 worktrees each carrying its own version, 'current' is ambiguous by construction, and the single dist/ folder Chrome loads can be built from any of them. The July system map's top risk was that dist/ held 6.8.2 from an unmerged widget branch while Malkio believed he was running 6.7.22. Severity HIGH. First seen: 2026-07-19. Workaround: check git worktree list and each worktree's manifest before building, per the CLAUDE.md build/load constraint."},{"from":"repo-sync-batch","to":"worktree-fleet","kind":"affects","detail":"A dead worktree pointer left in the workspace root: its .git is a FILE whose target no longer resolves, so git commands there fail with 'not a repository (NULL)'. Severity LOW functionally, MED as a navigation trap — it looks like a live codebase with a full source tree and changelog. First seen: stale since 2026-05-18. Workaround: archive or delete the directory."},{"from":"surface-inventory-doc","to":"repo-tabatha","kind":"plans"},{"from":"roadmap-doc","to":"repo-tabatha","kind":"plans"},{"from":"portfolio-doc","to":"repo-tabatha","kind":"plans"},{"from":"portfolio-doc","to":"gatekeeper","kind":"affects","detail":"Documentation defect with real cost: the portfolio describes the Gatekeeper as a new-tab intercept, when the new tab is overridden by home.html and the Gatekeeper is an all-URLs document_start content script. Severity MED for anyone onboarding — it inverts the product's central mechanism. First seen: portfolio predates the 6.x line entirely. Workaround: read src/content/gatekeeper.js and public/manifest.json instead."},{"from":"portfolio-doc","to":"desktop-companion","kind":"affects","detail":"The portfolio lists 'Desktop Integration' as unstarted Phase 5 work and the workspace summary claims v0.1.0 shipped, while the companion is at 0.3.10 with 8703 lines of Rust and eleven published releases. Severity MED — it makes the most technically distinctive surface in the product invisible. First seen: 2026-08-01 cross-check. Workaround: read tabatha-desktop's git log and the GitHub release list."},{"from":"roadmap-doc","to":"flux-ecosystem","kind":"affects","detail":"ROADMAP.md Phase 5 lists 'Flux Master Interface' integration as future work, but the Supabase project Tabatha already runs on is literally named Flux and the Asana home is Flux Development. Severity LOW-MED: it frames the substrate as an aspiration, which misdirects planning about what integration work actually remains. First seen: 2026-08-01. Workaround: treat the Flux dependency as existing infrastructure."},{"from":"surface-inventory-doc","to":"bug-version-drift","kind":"affects","detail":"Self-inflicted staleness: the internal system map is a point-in-time snapshot dated 2026-07-19 that is now wrong on nearly every specific (sidecar 0.2.1 vs 0.13.x, companion 0.2.1 vs 0.3.10, migrations 033 vs 060, extension 6.7.22 vs 6.7.82) while still reading as authoritative. Severity MED. First seen: 2026-08-01 cross-check. Workaround: regenerate it, or use this atlas."}],"clusters":[{"id":"gate","label":"The Attention Gate","members":["gatekeeper","gate-friction","context-inheritance","blockgate","inbar","url-rules","agent-human-toggle","inpop-header","bug-xss-sinks","bug-gatekeeper-race","bug-objectobject","goal-intentional-friction"]},{"id":"focus","label":"Focus, Time & Work Records","members":["focus-engine","focus-lifecycle","checkpoints","backburner","focus-queue","sub-intents","clock-shifts","surface-workshifts","surface-activity","unified-timeline","auto-focus","off-device","bug-break-notes","bug-b09-inbar","bug-clock-backdate","plan-221-clock","bug-elapsed-drift"]},{"id":"surfaces","label":"Extension Surfaces & Runtime","members":["sw-background","bg-services","surface-home","surface-sidebar","surface-popup","surface-settings","settings-live-preview","feedback-widget","hotkeys","notes-system","test-suite"]},{"id":"sync","label":"Cloud Sync & Identity Substrate","members":["supabase-backend","schema-tabatha","rls-policies","edge-functions","fn-pair-watch","fn-push","sync-service","cloud-outbox","data-rehydrate","realtime","auth-identity","device-management","invites","org-teams","bug-rls-revoke","bug-sync-root-a","bug-sync-root-d","plan-047-sync","corin-sync-integrity"]},{"id":"companions","label":"Companion Surfaces","members":["desktop-companion","os-focus-tracking","ws-bridge","ws-handshake","desktop-capture","desktop-updater","desktop-code-signing","companion-parity-gap","bug-assign-intent-deadend","sidecar-pwa","sidecar-context-view","phone-focus-mode","watch-app","watch-pairing","watch-tile","bug-watch-crash","mobile-expo-legacy","mobile-android-lab","goal-surface-parity"]},{"id":"dist","label":"Distribution & Web Presence","members":["site-marketing","showcase-show","docs-site","download-page","waitlist","cf-pages-functions","channel-staff","channel-enterprise","channel-cws","cws-deployment-task","store-assets","logo-redesign","bug-docs-stale","bug-version-drift","goal-cws-publish"]},{"id":"cortex","label":"Cortex, Agents & Voice","members":["cortex-program","capture-service","cortex-proxy","self-correction","agent-sessions","voice-io","plan-045-agent","mcp-server","plan-220-session-agg","taskrun-platform-review"]},{"id":"eco","label":"Ecosystem & Integrations","members":["flux-ecosystem","asana-integration","flux-asana-widget","mimir-connector","headbox","screensaver","calendar-sync","anasa-console","system-status-map"]},{"id":"substrate","label":"Repos, Branches & Release Substrate","members":["repo-tabatha","repo-desktop","repo-watch","repo-mobile-1","repo-mobile-2","repo-codex","repo-sync-batch","worktree-fleet","branch-update-channel","branch-staging","version-discipline","dist-archives","env-cf-pages","surface-inventory-doc","roadmap-doc","portfolio-doc"]}],"sources":[{"name":"Tabatha monorepo (code)","what":"src/, supabase/, sidecar/, site/, functions/, scripts/, store-assets/, public/manifest.json — read directly for feature inventory, schema, edge functions and build wiring","asOf":"2026-08-01"},{"name":"git history (5 repos)","what":"log, branches, remotes, worktrees and month-by-month commit histograms across Tabatha, tabatha-desktop, tabatha-watch, tabatha-mobile, tabatha-mobile-2 — the primary evidence for what is alive vs abandoned","asOf":"2026-08-01"},{"name":"GitHub MrMalkio/tabatha","what":"38 PRs (all merged), 1 open issue, and the ext-v* / desktop-v* release stream used as an incident journal","asOf":"2026-08-01"},{"name":"Asana — Flux Development project","what":"Tabatha's real tracker home (GID 1214031898449333); 40+ tasks reviewed with comment counts and newest-comment dates. The near-empty 'Tabatha Development' project is not where the work lives","asOf":"2026-08-01"},{"name":"docs/audits/ (9 documents)","what":"The 2026-07-19 surface parity audit and the 2026-07-21 Koda synthesis of ~110 findings from three parallel auditors — the single most reliable account of current wounds","asOf":"2026-07-25"},{"name":"docs/system-map/SYSTEM-MAP.md","what":"Hermes' 2026-07-19 automated surface/branch/version survey; method excellent, specifics now stale","asOf":"2026-07-19"},{"name":"Tabatha_Changelog.md","what":"156KB of per-version history; the newest entries (6.7.71-6.7.82) carry root-cause narratives, not just summaries","asOf":"2026-07-29"},{"name":"docs/features/ + docs/plans/","what":"71 numbered feature specs (#161-#222, B07-B09, D01) and 8 numbered plans (037, 038, 040-045)","asOf":"2026-07-27"},{"name":"docs/OPERATIONS.md + CWS-PUBLISHING.md","what":"The three distribution channels, their mechanics, and the explicit credential reality-check confirming CWS was never provisioned","asOf":"2026-07-21"},{"name":"Live health probes","what":"curl against Supabase REST/auth, tabatha.pondocean.co (site, /show, /sidecar, /enterprise/update.xml), the update-channel latest.json, and both Chrome Web Store IDs — with example.com and supabase.com as controls (both 200)","asOf":"2026-08-01"},{"name":"tabatha-portfolio.md","what":"The workspace portfolio entry, used as the claim set this map was asked to test — and largely falsified","asOf":"2026-08-01"}],"views":[{"id":"wounds","label":"WOUNDS","types":["bug","incident"],"note":"Every open defect and postmortem-class finding degrading Tabatha right now — mostly XSS sinks, RLS gaps, sync arbitration and version-drift bugs surfaced by the 2026-07-21/24 audits"},{"id":"inflight","label":"IN FLIGHT","types":["task","branch"],"statuses":["in-progress","blocked","partial","broken"],"note":"Active TaskRun work, unmerged branches (staging/main reconciliation, update-channel), and open distribution/code-signing pushes"},{"id":"roadmap","label":"ROADMAP","types":["plan","goal","milestone"],"note":"Cortex, the agent control layer, sync arbitration (Plan 047), clock backdating, and the CWS publish milestone"},{"id":"live","label":"LIVE SYSTEM","types":["feature","capability","service","infra","integration","surface"],"statuses":["live","working"],"note":"What is verified functional in production today, including surfaces confirmed by live curl probes on 2026-08-01"}],"updated":"2026-08-01T08:48:59.784Z"}
</script>
