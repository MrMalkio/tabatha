<title>Tabatha Atlas — Living System Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='24' fill='%233DFFA8'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2304090C'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --abyss:#04090C; --ink:#0B151A; --ink2:#0F1D24; --line:#16303A;
    --text:#C9DCE2; --dim:#6E8792; --faint:#3E5560;
    --live:#3DFFA8; --working:#35C9D4; --partial:#E8A33D; --inprog:#4DB8FF;
    --planned:#5F7189; --blocked:#B060FF; --broken:#FF4D5E; --killed:#3A4750; --unknown:#7A8B94;
    --mono:"Cascadia Code","SF Mono",Consolas,ui-monospace,monospace;
    --disp:"Segoe UI Variable Display","Segoe UI",-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--abyss);color:var(--text);font-family:var(--disp);overflow:hidden}
  canvas#web{position:fixed;inset:0;display:block;cursor:grab}
  canvas#web.dragging{cursor:grabbing}

  header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:20px;
    padding:9px 18px;background:linear-gradient(180deg,rgba(4,9,12,.94),rgba(4,9,12,.6) 72%,transparent);
    pointer-events:none}
  header>*{pointer-events:auto}
  h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:baseline;gap:9px}
  h1 small{font-family:var(--mono);font-weight:400;font-size:9px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
  .vitals{display:flex;gap:2px;font-family:var(--mono);font-size:10.5px;flex-wrap:wrap;border:1px solid var(--line);
    border-radius:999px;padding:3px 6px;background:rgba(11,21,26,.7)}
  .vital{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;cursor:pointer;color:var(--dim)}
  .vital:hover{background:var(--ink2);color:var(--text)}
  .vital .dot{width:7px;height:7px;border-radius:50%}
  .vital b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
  .hgroup{margin-left:auto;display:flex;align-items:center;gap:8px}
  #search{background:rgba(11,21,26,.8);border:1px solid var(--line);color:var(--text);border-radius:999px;
    padding:6px 14px;font-family:var(--mono);font-size:11.5px;width:190px;outline:none;transition:width .2s}
  #search:focus{border-color:var(--working);width:250px}
  .hbtn{background:none;border:1px solid transparent;color:var(--dim);border-radius:999px;
    padding:6px 11px;font-family:var(--mono);font-size:10.5px;cursor:pointer;letter-spacing:.08em}
  .hbtn:hover{color:var(--text);border-color:var(--line);background:rgba(11,21,26,.8)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px}
  .seg button{flex:1;background:none;border:none;color:var(--faint);font-family:var(--mono);font-size:9.5px;
    letter-spacing:.08em;padding:5px 0;cursor:pointer}
  .seg button.on{background:var(--ink2);color:var(--working)}
  .planeTag{position:fixed;right:14px;z-index:11;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    padding:4px 10px;border-radius:6px 0 0 6px;border-right:2px solid;background:rgba(9,17,21,.85);pointer-events:none;
    transition:opacity .2s}

  #rail{position:fixed;top:64px;left:14px;bottom:14px;width:248px;z-index:15;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;padding-right:6px;transition:transform .25s ease;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  #rail::-webkit-scrollbar,#dossier .body::-webkit-scrollbar,#modal .card::-webkit-scrollbar{width:6px}
  #rail::-webkit-scrollbar-track,#dossier .body::-webkit-scrollbar-track,#modal .card::-webkit-scrollbar-track{background:transparent}
  #rail::-webkit-scrollbar-thumb,#dossier .body::-webkit-scrollbar-thumb,#modal .card::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  #rail::-webkit-scrollbar-thumb:hover,#dossier .body::-webkit-scrollbar-thumb:hover{background:var(--faint)}
  #rail.hidden{transform:translateX(-280px)}
  .panel{background:rgba(11,21,26,.88);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(6px)}
  .panel h3{margin:0 0 8px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .frow{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;cursor:pointer;user-select:none;color:var(--text)}
  .frow:hover{color:#fff}
  .frow.off{color:var(--faint)}
  .frow.off .sw{opacity:.2}
  .sw{width:10px;height:10px;border-radius:3px;flex:none}
  .sw.round{border-radius:50%}
  .frow .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}

  .dials{display:flex;gap:10px 4px;justify-content:space-around;flex-wrap:wrap}
  .dial{display:flex;flex-direction:column;align-items:center;gap:5px}
  .dial svg{cursor:ns-resize;touch-action:none}
  .dial label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .dial .val{font-family:var(--mono);font-size:10px;color:var(--working);font-variant-numeric:tabular-nums}

  #dossier{position:fixed;top:64px;right:14px;bottom:14px;width:340px;min-width:300px;max-width:82vw;z-index:18;
    background:rgba(9,17,21,.94);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);
    transform:translateX(380px);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
  #dossier.open{transform:none}
  #dossier .head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  #dossier .kicker{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:flex;gap:8px;align-items:center}
  #dossier .kicker .dot{width:9px;height:9px;border-radius:50%}
  #dossier h2{margin:6px 0 0;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
  #dossier .body{padding:14px 18px;overflow-y:auto;scrollbar-width:thin;flex:1;font-size:12.5px;line-height:1.55}
  #dossier .blurb{color:var(--text)}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--mono);font-size:10.5px;margin:12px 0;padding:10px 12px;background:var(--ink2);border-radius:8px}
  .meta dt{color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
  .meta dd{margin:0;color:var(--text)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .chip:hover{color:var(--text);border-color:var(--dim)}
  .chip.bug{border-color:rgba(255,77,94,.4);color:var(--broken)}
  .chip.safe{border-color:rgba(61,255,168,.25);color:var(--live);cursor:default}
  .links{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .lnk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-family:var(--mono);font-size:10.5px;color:var(--text);text-decoration:none;cursor:pointer;background:none;text-align:left;width:100%}
  .lnk:hover{border-color:var(--working);color:#fff}
  .lnk .tag{font-size:8px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;flex:none;width:44px}
  .lnk .pth{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #dossier .close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer}
  #dHandle{position:absolute;top:0;left:0;bottom:0;width:7px;cursor:ew-resize;border-radius:14px 0 0 14px}
  #dHandle:hover,#dHandle.active{background:linear-gradient(90deg,rgba(53,201,212,.35),transparent)}
  .dbtn{display:inline-flex;align-items:center;gap:6px;margin:4px 6px 0 0;padding:7px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--ink2);color:var(--text);font-family:var(--mono);font-size:10px;letter-spacing:.08em;cursor:pointer}
  .dbtn:hover{border-color:var(--working);color:#fff}
  .dbtn.danger{border-color:rgba(255,77,94,.45);color:var(--broken)}
  .dbtn.danger:hover{background:rgba(255,77,94,.12)}
  .simBanner{border:1px solid rgba(176,96,255,.5);background:rgba(176,96,255,.08);border-radius:8px;padding:8px 12px;margin:10px 0;
    font-size:11.5px;color:var(--text)}
  .simBanner b{color:var(--blocked)}

  /* weight scales — bottom center */
  #dragbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:14;display:flex;flex-direction:column;gap:7px;
    background:rgba(9,17,21,.92);border:1px solid var(--line);border-radius:16px;padding:11px 18px;backdrop-filter:blur(6px)}
  #dragbar .row{display:flex;align-items:center;gap:12px}
  #dragbar .lab{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);width:82px;flex:none}
  #dragbar input[type=range]{-webkit-appearance:none;appearance:none;width:min(300px,34vw);height:4px;border-radius:99px;outline:none;
    background:linear-gradient(90deg,var(--live),var(--partial) 55%,var(--broken))}
  #dragbar input#pullSlider{background:linear-gradient(90deg,var(--faint),var(--inprog) 55%,#FFD84D)}
  #dragbar input#timeSlider{background:linear-gradient(90deg,var(--faint),var(--working))}
  #dragbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#0F1D24;border:2px solid var(--working);cursor:pointer;box-shadow:0 0 8px rgba(53,201,212,.5)}
  #dragbar input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#0F1D24;border:2px solid var(--working);cursor:pointer}
  #dragInfo,#pullInfo,#timeInfo{font-family:var(--mono);font-size:10px;color:var(--working);min-width:130px;font-variant-numeric:tabular-nums}
  #goalSearch{background:var(--ink2);border:1px solid var(--line);color:var(--text);border-radius:7px;font-family:var(--mono);
    font-size:10px;padding:4px 8px;width:160px;outline:none}
  #goalSearch:focus{border-color:var(--inprog)}
  .pRows{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .pRow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;font-family:var(--mono);font-size:10.5px;
    color:var(--text);cursor:pointer;border:1px solid transparent}
  .pRow:hover{background:var(--ink2);border-color:var(--line)}
  .pRow input{accent-color:#35C9D4;cursor:pointer}
  .pRow .pCopy{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;color:var(--dim);
    font-size:10px;padding:2px 7px;cursor:pointer}
  .pRow .pCopy:hover{color:#fff;border-color:var(--working)}
  #timeRow{display:none}
  #timeRow.avail{display:flex}
  #dragbar input#recSlider{background:linear-gradient(90deg,var(--faint),#B060FF 55%,#FF7ADF)}
  #recInfo{font-family:var(--mono);font-size:10px;color:var(--working);min-width:130px;font-variant-numeric:tabular-nums}
  #dragbar.collapsed .row{display:none}
  #dragbar.collapsed{padding:5px 14px}
  #barToggle{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ink2);border:1px solid var(--line);
    color:var(--dim);border-radius:999px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:2px 12px;cursor:pointer;line-height:1.5}
  #barToggle:hover{color:var(--text);border-color:var(--dim)}
  #dragbar.collapsed #barToggle{position:static;transform:none}
  .invert{background:none;border:1px solid var(--line);color:var(--faint);border-radius:6px;font-family:var(--mono);
    font-size:9px;padding:2px 7px;cursor:pointer;flex:none}
  .invert.on{color:#FF7ADF;border-color:rgba(255,122,223,.45)}
  .viewchip{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:6px 12px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;cursor:pointer}
  .viewchip:hover{color:var(--text);background:rgba(11,21,26,.8)}
  .viewchip.on{color:var(--working);border-color:var(--working);background:rgba(53,201,212,.1)}
  #viewBanner{position:fixed;left:50%;transform:translateX(-50%);top:58px;z-index:16;display:none;align-items:center;gap:12px;
    background:rgba(9,17,21,.94);border:1px solid var(--working);border-radius:999px;padding:7px 16px;font-size:11.5px;
    color:var(--text);backdrop-filter:blur(6px);max-width:90vw}
  #viewBanner.show{display:flex}
  #viewBanner a{font-family:var(--mono);font-size:10px;color:var(--working);white-space:nowrap}
  #viewBanner button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px}

  @media (max-width:1180px){
    header{gap:10px} .vitals{display:none}
    #rail{width:216px}
  }
  @media (max-width:900px){
    #rail{transform:translateX(-280px)} #rail.hidden{transform:none}
    #dossier{width:min(320px,88vw)} #search{width:110px} #search:focus{width:150px}
    #dragbar{max-width:94vw;padding:9px 12px} #dragbar input[type=range]{width:min(220px,40vw)}
    #dragInfo,#pullInfo,#timeInfo{min-width:0}
  }
  .sect{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:16px 0 4px}
  .activity{border-left:2px solid var(--partial);padding:6px 10px;margin-top:6px;font-size:11.5px;color:var(--text);background:rgba(232,163,61,.05);border-radius:0 6px 6px 0}
  .blastMeta{border-left:2px solid var(--broken);padding:6px 10px;margin-top:6px;font-size:11.5px;background:rgba(255,77,94,.06);border-radius:0 6px 6px 0}

  #modal{position:fixed;inset:0;z-index:40;background:rgba(2,6,8,.8);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  #modal.open{display:flex}
  #modal .card{width:min(680px,92vw);max-height:84vh;overflow-y:auto;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:26px 30px;font-size:13px;line-height:1.6}
  #modal h2{margin-top:0;letter-spacing:-.01em}
  #modal code{font-family:var(--mono);font-size:11px;background:var(--ink2);padding:1px 6px;border-radius:4px;color:var(--working)}
  #modal pre{background:var(--ink2);padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:11px;font-family:var(--mono);color:var(--text)}
  #modal .card h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:20px 0 6px}

  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);z-index:50;
    background:var(--ink2);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:11px;
    padding:8px 16px;border-radius:999px;transition:transform .25s;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0)}

  #summaryBar{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:16;width:min(820px,86vw);
    max-height:min(460px,60vh);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;
    background:rgba(9,17,21,.95);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:12px;
    line-height:1.55;color:var(--text);backdrop-filter:blur(8px);display:none}
  #summaryBar.show{display:block}
  #summaryBar .x{float:right;cursor:pointer;color:var(--faint);margin-left:10px;font-size:14px}
  #summaryBar h4{margin:0 0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  #summaryBar .statrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  #summaryBar .stat{font-family:var(--mono);font-size:10.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
  #summaryBar .stat b{color:var(--text);font-variant-numeric:tabular-nums}
  #summaryBar ul{margin:6px 0 0;padding-left:18px}
  #summaryBar li{margin-bottom:7px;color:var(--text)}
  #summaryBar .attack{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
  #summaryBar .attack .chip{margin:3px 4px 0 0;display:inline-flex}

</style>

<canvas id="web"></canvas>

<header>
  <h1>ATLAS <small>v0.0.4</small></h1>
  <div class="vitals" id="vitals" title="Live census by status — click a pill to isolate that status, click again to clear"></div>
  <div class="hgroup">
    <span id="viewChips" style="display:flex;gap:6px"></span>
    <input id="search" type="search" placeholder="search…" autocomplete="off" title="Filter nodes by name, id, or blurb text">
    <button class="hbtn" id="btnRail" title="Show / hide the filter rail">FILTERS</button>
    <button class="hbtn" id="btnKey" title="How to read the map: encodings, shapes, status meanings">KEY</button>
    <button class="hbtn" id="btnSummary" title="State of play: ratings, summary brief, where to attack">STATE</button>
    <button class="hbtn" id="btnGuide" title="How agents update this map">GUIDE</button>
  </div>
</header>

<div id="rail"></div>

<aside id="dossier">
  <div id="dHandle" title="drag to resize"></div>
  <button class="close" id="dClose">✕</button>
  <div class="head"><div class="kicker" id="dKicker"></div><h2 id="dTitle"></h2></div>
  <div class="body" id="dBody"></div>
</aside>

<div id="summaryBar"><span class="x" id="sumClose">✕</span><div id="sumText"></div></div>

<div id="dragbar">
  <button id="barToggle" title="Hide / show the prioritization scales">▾ SCALES</button>
  <div class="row" title="Negative-impact ranking: wounded nodes score by how much they degrade, weighted by the importance of what they hit. Slide right to fade everything below the threshold.">
    <span class="lab">DRAG WEIGHT</span>
    <input id="dragSlider" type="range" min="0" max="100" value="0">
    <span id="dragInfo"></span>
  </div>
  <div class="row" title="Pick a goal / milestone / component, then slide: nodes fade by how little they feed, align with, or block that target. Combine with Drag Weight to pick what to attack.">
    <span class="lab">GOAL PULL</span>
    <input id="goalSearch" list="goalList" placeholder="search goal…" autocomplete="off">
    <datalist id="goalList"></datalist>
    <input id="pullSlider" type="range" min="0" max="100" value="0" disabled>
    <span id="pullInfo"></span>
  </div>
  <div class="row" title="Recency of updates and contributions. Slide right to isolate the freshest work; flip ⇄ to hunt neglected load-bearing nodes instead.">
    <span class="lab">RECENCY</span>
    <input id="recSlider" type="range" min="0" max="100" value="0">
    <button class="invert" id="recInvert" title="Invert: isolate the STALEST important nodes instead of the freshest">⇄ STALE</button>
    <span id="recInfo"></span>
  </div>
  <div class="row" id="timeRow" title="Scrub through recorded snapshots of the map — watch statuses shift over time. Drag Weight is disabled while time-traveling.">
    <span class="lab">TIME</span>
    <input id="timeSlider" type="range" min="0" max="0" value="0">
    <span id="timeInfo"></span>
  </div>
</div>

<div id="viewBanner"><span id="viewNote"></span><a id="viewPage" target="_blank" rel="noopener"></a><button id="viewClose" title="Clear this view">✕</button></div>

<div id="modal"><div class="card" id="modalCard"></div></div>
<div id="toast"></div>

<!-- ══════════════════════════════════════════════════════════════════
     ATLAS DATA — the single source of truth for this map.
     Agents: edit ONLY this instance's atlas-data.json, then run its sync-data.js
     to regenerate this block, and republish. See the AGENT GUIDE button in-app.
     The instance declares its own file paths via the data doc's `paths` field.

<script id="atlas-data" type="application/json">

unds are concentrated and known: ~23 unescaped innerHTML sinks across gatekeeper.js and inbar.js that are cross-user reachable today via manager RLS scoping, an RLS gap letting a revoked device un-revoke itself, and two named sync arbitration root causes (A: recency-based arbitration; D: clock adoption duplicating shifts) that have a plan number reserved (047) and nothing built. The engineering machine itself is unusually strong — 40 live worktrees, 63 unit-test files, a version-sync pre-commit gate, a daily automated Asana status survey — which is exactly why the docs drift: the code moves faster than anything written about it.","nodes":[{"id":"gatekeeper","label":"Gatekeeper","type":"feature","status":"live","priority":"high","updatedAt":"2026-07-25","activity":"7/25: 6.7.76 closed the [object Object] sanitize gap on gatekeeper's own intentHistory/intentPresets read — self-healing repair-on-read now writes corrected data back.","blurb":"The intentional-friction layer and Tabatha's founding idea: before you can consume a page you must declare why you are there. Contrary to the portfolio's description it is NOT the new-tab override (that is home.html) — it is an all-URLs content script at document_start that intercepts navigation to any page, rendering a closed shadow-DOM gate. Complete and heavily hardened: a synchronous dim placeholder goes up before any await so the page cannot render underneath the gate, and a 2500ms timeout tears it down rather than trapping the user.","deep":"Files: src/content/gatekeeper.js (679 lines, single IIFE, closed shadow DOM). Decision logic lives in src/background/services/tabService.js checkContextNeeded() at ~L473.\\n\\nStates: (1) double-injection guard on #tabatha-gatekeeper-host; (2) fast local pre-check of settings.gatekeeperEnabled — a missing or unreadable setting FAILS TOWARD GATING; (3) indeterminate — synchronous dim placeholder with pointerEvents none so clicks still pass through; (4) CHECK_CONTEXT_NEEDED round-trip under r the intent popup. Confirmed unbuilt by the 2026-07-21 parity audit, which noted the reusable InBar plumbing is already there. Small, cheap, and still sitting in the backlog.","links":{"md":"docs/features/212-inpop-intent-dropdown-header.md"},"sources":["docs/features/212-inpop-intent-dropdown-header.md"]},{"id":"bug-xss-sinks","label":"23 Unescaped HTML Sinks","type":"bug","status":"broken","priority":"high","updatedAt":"2026-07-21","activity":"7/21: Koda's synthesis re-verified and found it WORSE than reported — ~23 sinks not ~12, and cross-user reachable TODAY, not contingent on a future feature.","blurb":"No escapeHtml() helper exists anywhere in src/. About 23 distinct unescaped innerHTML sites across gatekeeper.js (4) and inbar.js (~19), including notes rendered raw inside a textarea and nine auto-triggered overlay sites. The exploitability was re-classified upward: focus_items.label already syncs to Supabase and is already readable cross-user through the manager/team RLS scoping in migration 012, so a malicious label set on one device renders unescaped in a manager's browser. This is the single highest-ranked NOW item in the audit and it is still open.","links":{"md":"docs/audits/2026-07-21-SYNTHESIS.md"},"sources":["docs/audits/2026-07-21-SYNTHESIS.md NOW #1"]},{"id":"bug-gatekeeper-race","label":"Gate Render Race","type":"bug","status":"killed","updatedAt":"2026-07-25","activity":"Fixed — gatekeeper.js now attaches a synchronous dim placeholder before any await, so the page cannot paint under the gate.","blurb":"The page could render before the intent gate appeared, because the overlay was built only after awaiting CHECK_CONTEXT_NEEDED plus two storage round-trips. Undermined the core 'declare intent before browsing' guarantee. Resolved by the synchronous placeholder pattern now visible in the code.","links":{"md":"src/content/gatekeeper.js"},"sources":["docs/audits/2026-07-21-SYNTHESIS.md NOW #12","src/content/gatekeeper.js current code"]},{"id":"bug-obje companion) is ultimately a view onto this engine's state. Its blast radius is the widest in the system: a throw inside its row-builder silently aborts the whole sync cycle, which is exactly the regression 6.7.73 fixed.","links":{"md":"src/background/services/focusService.js"},"sources":["src/background/services/focusService.js","Tabatha_Changelog.md v6.7.73"]},{"id":"focus-lifecycle","label":"Focus Lifecycle","type":"feature","status":"live","priority":"high","updatedAt":"2026-07-24","activity":"Start / pause / resume / resolve / +5m extend, with funnel stages Unsorted → Todo → Focus → Addressing → Roadblocked → Resolved. Timer freezes on pause and rebases on resume, identically on all four surfaces.","blurb":"The verbs of the system, and the one thing implemented consistently everywhere — the watch's TimerEngine is a pure Kotlin port that deliberately mirrors the Sidecar's focus.ts freeze-on-pause / rebase-on-resume math. Reaching that consistency took the 6.7.71 and 6.7.73 elapsed-drift fixes.","links":{"md":"docs/features.md"},"sources":["src/background/services/focusService.js","tabatha-watch/README.md"]},{"id":"checkpoints","label":"Checkpoint Progress Notes","type":"feature","status":"live","updatedAt":"2026-07-24","activity":"Live on extension, sidecar and watch. Five canned progress levels; staleness dot after 30 minutes; a checkpoint added on the wrist appears everywhere within a second.","blurb":"Structured mid-focus check-ins — a note plus one of five progress levels (None / Little / A lot / Almost / Stuck). This is the highest-value capture moment in the product and the clearest proof that cross-surface sync works, since it round-trips watch → cloud → browser in about a second.","links":{"md":"supabase/migrations/032_focus_checkpoints.sql"},"sources":["supabase/migrations/032_focus_checkpoints.sql","tabatha-watch/README.md"]},{"id":"backburner","label":"Backburner","type":"feature","status":"partial","updatedAt":"2026-07-25","activity":"7/25: B1 promoted s — break a focus into children that carry their own timers and appear in a nested queue. Data-layer complete and Sidecar-native; the parity audit flags that the extension renders them but does not offer the full CRUD the Sidecar does.","links":{"md":"docs/audits/2026-07-19-surface-parity.md"},"sources":["docs/audits/2026-07-19-surface-parity.md"]},{"id":"clock-shifts","label":"Clock & Work Shifts","type":"feature","status":"partial","priority":"high","updatedAt":"2026-07-25","activity":"7/25: #221 confirms there is NO way to fix a missed clock-in — clockIn()/clockOut() take no arguments and hardcode new Date().","blurb":"Clock in / out / break with stint tracking, concurrent-shift guards, and abandoned-stint reconciliation across devices — the layer that turns attention data into billable hours. Partial for a blunt reason: the times cannot be edited. Work Shifts' 'Edit Shift' is a disabled stub, no EDIT_SHIFT handler exists, and the handlers ignore any payload passed to them.","links":{"md":"src/background/services/clockService.js"},"sources":["src/background/services/clockService.js","docs/features/221-clock-backdate-and-recovery.md"]},{"id":"surface-workshifts","label":"Work Shifts Page","type":"surface","status":"partial","updatedAt":"2026-07-21","activity":"Five controls ship as disabled buttons wearing a 'SOON' badge: Edit Shift, Delete, Export Week, Export PDF Timesheet, Sync to Cloud.","blurb":"A dedicated page for shifts, schedules and the Live Stints panel that reconciles ghost sessions across installs. Honest about its gaps — five of its actions are explicitly badged as stubs rather than pretending to work, which is the pattern the one genuinely dishonest control (Break Notes) fails to follow.","links":{"md":"src/workshifts/index.jsx"},"sources":["src/workshifts/index.jsx L262-485"]},{"id":"surface-activity","label":"Activity & Backdating Editor","type":"surface","status":"partial","updatedAt":"2026-07-21","activity":"Drag/split/merge of time blocks, custom activity logs, and the retroactive-revision approval flow all carry 'Coming soon' copy.","blurb":"The retroactive time-editing surface — where a day's tracked blocks get corrected after the fact. The viewer works; the editing verbs that make it useful (drag, split, merge) are unbuilt, which is why #221 treats clock recovery as an unsolved problem rather than a UI wiring job.","links":{"md":"src/activity/index.jsx"},"sources":["src/activity/index.jsx L345,L382"]},{"id":"unified-timeline","label":"Unified Timeline","type":"feature","status":"partial","updatedAt":"2026-07-21","activity":"7/21: H7 — the timeline early-returns empty whenever sessions.length === 0, so anyone without the optional desktop companion sees a blank Context Activity with no explanation.","blurb":"The single chronological view folding browser context, OS window sessions, and clock markers into one strip. It is the payoff for running every surface — and it is also the clearest example of the companion being treated as mandatory in code while being optional in product: users without it lose even their own clock markers.","links":{"md":"docs/audits/2026-07-21-SYNTHESIS.md"},"sources":["docs/audits/2026-07-21-SYNTHESIS.md NOW #9"]},{"id":"auto-focus","label":"Auto-Focus & Drift Detection","type":"capability","status":"live","updatedAt":"2026-07-20","activity":"Plan 036 shipped (v6.3.3–6.3.6); drift state now drives voice-announced overlays and push notifications.","blurb":"Detects when attention has drifted from the declared focus and when a new focus should be inferred automatically. Drift is the signal that feeds the nudge system, the InBar amber state, and the drifted push notification — making it the connective tissue between passive tracking and active intervention.","links":{"md":"docs/plans/plan-037-time-editing.md","gh":{"url":"https://github.com/MrMalkio/tabatha/pull/21","label":"PR #21 — Intelligent Focus Lifecycle + Time Editing + URL Rules Domain Store (v6.3.3)"}},"comments":0,"sources":["GitHub PR #21","src/background/services/autoFocusService.js"]},{"id":"off-device","label":"Off-Computer Toggle","type":"feature","status":"live","updatedAt":"2026-07-19","activity":"7/19: parity audit calls its absence from the desktop companion an 'ironic gap' — the companion is the authority on whether you are at the computer, and cannot say so.","blurb":"Marks a focus as continuing away from the machine so idle detection stops penalising it. Live on the extension sidebar and the Sidecar. The companion — which literally owns the idle and window signal that should drive it — has no such toggle, and the audit ranks adding it as the single highest-value companion addition.","links":{"md":"docs/audits/2026-07-19-surface-parity.md"},"sources":["docs/audits/2026-07-19-surface-parity.md Table 2"]},{"id":"bug-break-notes","label":"Break Notes Never Persist","type":"bug","status":"broken","updatedAt":"2026-07-21","activity":"7/21: promoted as 'the one place in the whole audit where the UI actively lies about whether input was saved'.","blurb":"BreakNotes saves to local React state only — the code comment literally reads 'In production this would persist via sendMessage.' Unlike its correctly-badged 'SOON' siblings it presents as a working input. Cheapest possible fix is the same stub badge used elsewhere; the real fix is a save handler into clockService.","links":{"md":"docs/audits/2026-07-21-SYNTHESIS.md"},"sources":["docs/audits/2026-07-21-SYNTHESIS.md NOW #10"]},{"id":"bug-b09-inbar","label":"B09 — InBar Edit/Assign Inconsistency","type":"bug","status":"broken","updatedAt":"2026-07-25","activity":"7/25: root-caused and specced in the 6.7.79 intake batch, with fix shape and acceptance criteria. Not yet implemented.","blurb":"Clicking a focus in the InBar edit dropdown sends only SWITCH_FOCUS and never saves the name the user typed; pressing Save instead triggers autoQueueFromIntent, which severs the link just made and spawns a stray queued sub-focus. Two paths, two different wrong outcomes, on the surface users touch most often.","links":{"md":"docs/features/B09-inbar-edit-assign-inconsistency.md","gh":{"url":"https://github.com/MrMalkio/tabatha/pull/38","label":"PR #38 — docs(intake): 2026-07-25 batch — #220 agent session aggregation, B09 InBar root cause, parity/sync/voice audits (6.7.79)"}},"comments":0,"sources":["docs/features/B09-inbar-edit-assign-inconsistency.md","GitHub PR #38"]},{"id":"bug-clock-backdate","label":"Missed Clock-In Is Unfixable","type":"bug","status":"broken","priority":"high","updatedAt":"2026-07-25","activity":"7/25: #221 spec confirms no EDIT_SHIFT handler exists at all, and warns that editing times would insert a DUPLICATE row because shift sync IDs are hashed from the clock times.","blurb":"Forget to clock in and the hours are simply gone — clockIn()/clockOut() hardcode new Date() and ignore any payload. Worse, the naive fix is booby-trapped: shift-row sync IDs are hashed from the clock times, so editing a time creates a duplicate row rather than updating one (this is sync Root Cause D). An immutable session id has to land first.","links":{"md":"docs/features/221-clock-backdate-and-recovery.md"},"sources":["docs/features/221-clock-backdate-and-recovery.md"]},{"id":"plan-221-clock","label":"#221 Clock Backdate & Recovery","type":"plan","status":"planned","updatedAt":"2026-07-25","activity":"7/25: specced in 6.7.80 — backdated clock-in, real shift editing, and an evidence-ranked start-time proposal presented as confirm-or-adjust.","blurb":"The spec that fixes the missed clock-in hole. Its cleverest part is the evidence ladder for proposing when you actually started: companion OS activity → first focus → capture frame → tab activity → calendar, offered as a confirmation rather than a guess. Also carries the consent model that Org Hours depends on.","links":{"md":"docs/features/221-clock-backdate-and-recovery.md"},"sources":["Tabatha_Changelog.md v6.7.80"]},{"id":"bug-elapsed-drift","label":"Cross-Surface Elapsed Drift","type":"bug","status":"killed","updatedAt":"2026-07-24","activity":"Fixed in 6.7.71 by back-dating _startedAt to mirror the Sidecar's resume math; 6.7.73 then hardened the same code against a malformed timestamp.","blurb":"An active focus's elapsed time was undercounted by exactly its accumulated pause time on every surface but the extension, worsening with each pause/resume cycle — a concrete slice of Malkio's 'syncing between surfaces still a little off'. Fixed, with a red-to-green unit test, and then immediately re-hardened when adversarial review found the fix could throw.","links":{"md":"Tabatha_Changelog.md"},"sources":["Tabatha_Changelog.md v6.7.71 and v6.7.73"]},{"id":"sw-background","label":"MV3 Service Worker","type":"service","status":"live","priority":"high","updatedAt":"2026-07-29","activity":"Reduced from a monolith to a 337-line entry by Plan 023; a single alarm router and a single auth owner now sit behind it.","blurb":"The extension's spine. Everything the content scripts, pages and companion bridge do routes through this worker. Its known operational hazard is documented in CLAUDE.md as a hard rule: a stale worker running against swapped assets makes every sendMessage hang, which has already been root-caused as the cause of an apparent whole-product outage.","links":{"md":"src/background/background.js"},"sources":["src/background/background.js","CLAUDE.md build/load constraint"]},{"id":"bg-services","label":"37 Background Services","type":"capability","status":"live","priority":"high","updatedAt":"2026-07-29","activity":"Output of Plan 023's decomposition (PRs #1–#12, May 2026) — the monolith became 37 named services with a router skeleton.","blurb":"The decomposed service layer: focus, sync, clock, tab, companion, capture, awareness, device, calendar, cortex and 27 more. This refactor is why the July velocity was possible — 364 commits in one month across 40 worktrees only works because the zones are separable. Plan 023 is the highest-leverage engineering decision in the repo's history.","links":{"md":"docs/architecture/service-map.md","gh":{"url":"https://github.com/MrMalkio/tabatha/pull/11","label":"PR #11 — refactor(background): Plan 023 router finalization"}},"comments":0,"sources":["src/background/services/ (37 files)","GitHub PRs #1-#12"]},{"id":"surface-home","label":"Home / New Tab","type":"surface","status":"live","priority":"high","updatedAt":"2026-07-21","activity":"7/21: header layout fix shipped (clock spacing, greeting cutoff, icon bunching, pill overlap).","blurb":"The actual new-tab override (home.html) and the product's dashboard — FlipClock, Context Activity timeline, intents, initiatives, projects/clients, analytics and the activity heatmap in 2481 lines. Note this is what the manifest overrides; the Gatekeeper is a separate all-URLs intercept, a distinction every portfolio doc gets wrong.","links":{"md":"src/home/index.jsx","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216767827238609","label":"Home header layout fix: clock spacing, greeting cutoff, icon bunching, pill overlap"}},"comments":0,"sources":["public/manifest.json chrome_url_overrides","src/home/index.jsx"]},{"id":"surface-sidebar","label":"Sidebar (Side Panel)","type":"surface","status":"live","priority":"high","updatedAt":"2026-07-19","activity":"7/19: parity audit made this the reference surface — 20 of its options are missing from the desktop companion.","blurb":"The always-accessible command centre: five panels (focus, tasks, tabs, groups, stash) reachable on Ctrl+Shift+S. It is the de-facto specification of what a complete Tabatha surface looks like — every parity audit measures the companion, sidecar and watch against it.","links":{"md":"src/sidebar/index.jsx"},"sources":["src/sidebar/index.jsx","docs/audits/2026-07-19-surface-parity.md"]},{"id":"surface-popup","label":"Popup / Quick Switch","type":"surface","status":"partial","updatedAt":"2026-07-21","activity":"7/21: B9 — the search placeholder advertises Ctrl+Space while the real shortcut is Ctrl+Shift+E. One-line fix, open.","blurb":"The toolbar popup for fast intent switching and tab search. Small and functional, but it tells users the wrong keyboard shortcut — a trivially fixable trust leak on the fastest path into the product.","links":{"md":"src/popup/index.jsx"},"sources":["src/popup/index.jsx","docs/audits/2026-07-21-SYNTHESIS.md"]},{"id":"surface-settings","label":"Settings","type":"surface","status":"partial","priority":"high","updatedAt":"2026-07-24","activity":"7/24: 6.7.72 added the Asana PAT connect card, reaching parity with the Sidecar's Epic 3 integration.","blurb":"24 sections with search, live preview, and the panels for devices, org/team activity, Cortex, Asana and URL rules. Partial because 11 of the 24 live-preview panes render blank with no fallback message, and the information architecture is an explicit OVERHAUL theme — Cortex is buried under 'Privacy & Capture' and Team Activity sits at a different altitude from Devices.","links":{"md":"src/settings/index.jsx"},"sources":["src/settings/index.jsx","docs/audits/2026-07-21-SYNTHESIS.md OVERHAUL theme 1"]},{"id":"settings-live-preview","label":"Settings Live Preview","type":"feature","status":"partial","updatedAt":"2026-07-21","activity":"7/21: 11 of 24 sections render a blank preview pane with no fallback message. The cheap half (add the existing generic fallback string) is a NOW item.","blurb":"A preview pane that shows what a setting will actually do before you commit to it — a genuinely good idea, half-delivered. Building real mockups for Context View and Blocked Sites is overhaul-scoped, but simply printing the existing fallback string everywhere it is missing is a same-day fix.","links":{"md":"src/settings/index.jsx"},"sources":["docs/audits/2026-07-21-SYNTHESIS.md"]},{"id":"feedback-widget","label":"In-App Feedback → Asana","type":"feature","status":"live","updatedAt":"2026-07-23","activity":"7/23: feedback-review agent protocol doc opened as TR-15; the pipeline itself is proven by live QA probes landing as Asana tasks.","blurb":"A feedback widget that files bugs and ideas straight into the Asana intake board via an edge function, with a graceful fallback to a prefilled GitHub issue when unconfigured. Genuinely closed-loop: several tasks in the tracker are visibly the output of this widget, including QA probes.","links":{"md":"supabase/functions/feedback-to-asana/index.ts","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216808364241653","label":"TR-15 feedback-review agent protocol doc"}},"comments":0,"sources":["supabase/functions/feedback-to-asana/index.ts","functions/api/feedback.js"]},{"id":"hotkeys","label":"Hotkey Coverage","type":"feature","status":"partial","updatedAt":"2026-07-21","activity":"Two commands registered in the manifest (Ctrl+Shift+S side panel, Ctrl+Shift+E tab list). #215 asks for comprehensive coverage; unbuilt.","blurb":"Rapid intent declaration without touching the mouse — named in the roadmap's original feature backlog and still only two shortcuts deep. For a product whose whole thesis is reducing the cost of declaring intent, this is a conspicuously thin surface.","links":{"md":"docs/features/215-comprehensive-hotkey-coverage.md"},"sources":["public/manifest.json commands","docs/features/215-comprehensive-hotkey-coverage.md"]},{"id":"notes-system","label":"#222 Notes System","type":"feature","status":"planned","updatedAt":"2026-07-27","activity":"7/27: specced in 6.7.81 and filed to the tracker. Status check found there is no free-standing note anywhere in the product today.","blurb":"A real notepad — a flat stream rather than a filing hierarchy, deliberately avoiding a second taxonomy competing with Contexts. The design answer to 'may or may not be connected to the current focus' is two fields: an immutable contextStamp recorded always, plus an optional one-click linkedFocusId, so resolving a focus can never bury a note. V1 targets the extension sidebar and the desktop companion.","links":{"md":"docs/features/222-notes-system.md","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216922774878600","label":"#222 Notes System — standalone notepad (sidebar + companion V1), optional focus linkage, Mimir opt-in sink"}},"comments":0,"sources":["docs/features/222-notes-system.md","Tabatha_Changelog.md v6.7.81"]},{"id":"test-suite","label":"Test Suite","type":"capability","status":"partial","updatedAt":"2026-07-29","activity":"63 test files on Node's built-in node:test, plus chromeMock and supabaseFake fixtures. No React component tests, no E2E, no browser automation.","blurb":"Strong where it counts and absent where it hurts. Pure helpers and service logic — sync resilience, attribution, outbox, sanitizers, schedule model, org permissions, migration lint — are well covered. UI verification is entirely manual, which is why the audits keep finding rendering-layer bugs (XSS sinks, blank preview panes, [object Object]) that no test could have caught.","links":{"md":"test/"},"sources":["package.json test script","test/ (63 files)"]},{"id":"supabase-backend","label":"Supabase Backend (project \"Flux\")","type":"infra","status":"live","priority":"high","updatedAt":"2026-08-01","activity":"8/1: probed live — REST and auth endpoints both answer 401 'No API key found', i.e. the API is up and correctly rejecting unauthenticated calls. Controls example.com and supabase.com both 200.","blurb":"The single spine every surface shares — and the hardest evidence that Tabatha is a Flux child rather than a sibling: the linked project is literally NAMED 'Flux' (ref mtdgoahskcibjbhfvofx). Postgres with a dedicated `tabatha` schema, Auth, Realtime, Storage, Edge Functions and pg_cron. One production project, no staging.","links":{"web":{"url":"https://mtdgoahskcibjbhfvofx.supabase.co","label":"Supabase project mtdgoahskcibjbhfvofx (named \"Flux\")"}},"sources":["supabase/.temp/linked-project.json","live curl probe 2026-08-01"]},{"id":"schema-tabatha","label":"tabatha Schema (71 migrations)","type":"infra","status":"live","priority":"high","updatedAt":"2026-07-29","activity":"Migrations 001 → 060, with gaps at 029, 046-049 and 051-057 — the sequence jumps 045 → 050 → 058.","blurb":"Roughly 40 tables and 34 SECURITY DEFINER functions covering focus items, checkpoints, events, clock sessions, desktop activity, calendars, orgs/teams, invites, devices, push and the Cortex ledger. Three migrations carry dedicated lint tests. The numbering gaps are worth noting: they mean migrations were drafted and abandoned, so the file list is not a reliable record of what was ever considered.","links":{"md":"supabase/migrations/"},"sources":["supabase/migrations/ (71 files)"]},{"id":"rls-policies","label":"RLS & Manager Scoping","type":"capability","status":"partial","priority":"high","updatedAt":"2026-07-21","activity":"7/21: migration 015 fixed a recursion bug and 016 restored write RLS, but the revoke guard is still missing; 045 explicitly notes no policy change was made for its new columns.","blurb":"Row-level security is what makes a single shared project safe for org/team scoping — and it is also the layer through which the XSS bug becomes cross-user. Migration 012's manager/team scoping means one user's focus label is readable in another user's browser, which is exactly why the unescaped-sinks bug was reclassified upward from self-XSS.","links":{"md":"supabase/migrations/016_restore_browser_profiles_write_rls.sql"},"sources":["supabase/migrations/012,015,016,045","docs/audits/2026-07-21-SYNTHESIS.md NOW #2"]},{"id":"edge-functions","label":"Edge Functions (11)","type":"service","status":"live","priority":"high","updatedAt":"2026-07-25","activity":"Eleven deployed functions; three run on pg_cron (asana sync every 5 min, focus push every 1 min, schedule nudges every 5 min).","blurb":"The server-side surface: asana-webhook, connect-asana, disconnect-asana, sync-asana-tasks, cortex-proxy, device-signout, feedback-to-asana, invite-check, pair-watch, send-focus-push, send-schedule-nudges. These are what let the watch and phone work without an extension anywhere near them.","links":{"md":"supabase/functions/"},"sources":["supabase/functions/ (11 dirs)","supabase/config.toml"]},{"id":"fn-pair-watch","label":"pair-watch Function","type":"service","status":"live","updatedAt":"2026-07-25","activity":"7/25: Dex shipped a pair-watch fix plus brute-force hardening after the 2026-07-24 live E2E run.","blurb":"Mints and redeems the 6-digit code that lets a watch join an account without ever seeing a password. Mint is JWT-authenticated; redeem is deliberately unauthenticated (verify_jwt=false) because the watch has no session yet — which is precisely why it needed brute-force hardening.","links":{"md":"supabase/functions/pair-watch/index.ts","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216867648342595","label":"[Dex] pair-watch fix + brute-force hardening — 2026-07-24"}},"comments":3,"lastComment":"2026-07-25","sources":["supabase/functions/pair-watch/index.ts","supabase/migrations/040_watch_pairing_codes.sql"]},{"id":"fn-push","label":"Web Push Functions","type":"service","status":"partial","updatedAt":"2026-07-25","activity":"send-focus-push covers timer_expired, drifted, checkpoint_stale and focus_away. send-schedule-nudges only does the clock-in nudge — its blockStart and idleNudge paths are marked v2/v3 and are NOT built.","blurb":"VAPID Web Push driven by pg_cron, with dedup logging so a nudge cannot fire twice. This is the mechanism that makes the phone useful without the app open. Honest in its own header about what it does not yet do, which is more than most of this codebase's docs manage.","links":{"md":"supabase/functions/send-focus-push/index.ts"},"sources":["supabase/functions/send-focus-push/index.ts","supabase/functions/send-schedule-nudges/index.ts"]},{"id":"sync-service","label":"Sync Service (push)","type":"capability","status":"partial","priority":"high","updatedAt":"2026-07-25","activity":"7/25: sync forensics (Sable) and the sync-integrity cluster (Corin) both landed; two named root causes remain open.","blurb":"1206 lines of watermark-based push sync with a 20-row diagnostics ring and column-missing resilience. The architecture is deliberately asymmetric — mostly push-up, with only two narrow once-per-install pull-downs — which works until two devices disagree, and that disagreement is exactly Root Cause A.","links":{"md":"src/background/services/syncService.js","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216882088851799","label":"[Sable] Cross-surface sync forensics — 2026-07-24"}},"comments":1,"lastComment":"2026-07-25","sources":["src/background/services/syncService.js","docs/audits/2026-07-24-sync-forensics.md"]},{"id":"cloud-outbox","label":"Durable Cloud Outbox","type":"capability","status":"live","updatedAt":"2026-07-24","activity":"cloudWriteService is the single auth owner; page contexts enqueue into _cloudOutbox when the service worker is unreachable, flushed by an alarm.","blurb":"The offline-and-flaky-worker safety net. Establishing 'background is the single auth owner' and routing every write through a durable queue is what stops MV3's service-worker lifecycle from silently eating user data — a real risk given the documented stale-worker failure mode.","links":{"md":"src/background/services/cloudWriteService.js"},"sources":["src/background/services/cloudWriteService.js","src/utils/cloudOutbox.js"]},{"id":"data-rehydrate","label":"Rehydrate & Bootstrap Pull","type":"capability","status":"partial","updatedAt":"2026-07-24","activity":"Both run ONCE per install, gated by _dataRehydratedAt and _orgRegistryBootstrappedAt. desktop_activity rehydrate is explicitly 'intentionally NOT done here for day one'.","blurb":"The only two paths that pull cloud state down into a fresh install — org registry bootstrap and a sign-in rehydrate of clock sessions, intent history and focus items. Because they are once-per-install, a device that drifts after that first pull has no repair path, which is the structural reason Root Cause A keeps producing symptoms.","links":{"md":"src/background/services/dataRehydrate.js"},"sources":["src/background/services/dataRehydrate.js","src/background/services/bootstrapPull.js"]},{"id":"realtime","label":"Supabase Realtime","type":"capability","status":"partial","updatedAt":"2026-07-17","activity":"Migrations 011/033/045 publish profiles, focus_items, browser_profile_status and browser_profiles to supabase_realtime. The Sidecar subscribes; the extension does NOT.","blurb":"Live cross-surface updates — the reason a checkpoint on the watch appears on the phone within a second. The asymmetry matters: the phone is a realtime client and the browser extension is not, so the extension is always the last surface to learn that something changed.","links":{"md":"supabase/migrations/033_realtime_focus_status.sql"},"sources":["supabase/migrations/011,033,045","sidecar/src/data/focus.ts"]},{"id":"auth-identity","label":"Auth & Session Identity","type":"capability","status":"live","priority":"high","updatedAt":"2026-07-21","activity":"Web Locks disabled with a noop lock and a custom chrome.storage.local session adapter, so the service worker and every extension page share one session.","blurb":"Getting Supabase auth to work inside MV3 took two dedicated fix PRs (#17, #18) to defeat a Web-Locks contention cascade. The result is solid, but the SMTP is still unbranded — sign-in mails come 'from supabase.co' because custom SMTP was never configured, blocked only on an app password.","links":{"md":"src/services/supabaseClient.js","gh":{"url":"https://github.com/MrMalkio/tabatha/pull/17","label":"PR #17 — fix(auth): disable supabase-js Web Locks — fixes lock-contention abort cascade"}},"comments":0,"sources":["src/services/supabaseClient.js","docs/audits/2026-07-21-SYNTHESIS.md NOW #6"]},{"id":"device-management","label":"Device Management","type":"feature","status":"partial","updatedAt":"2026-07-25","activity":"Migration 045 added the device columns; 6.7.53/6.7.54 added session-aware revoked-row reclaim in application code. The RLS half is still missing.","blurb":"A device roster with remote sign-out, built after ghost-stint chaos from installs that never died properly. The application-code fix works; the database does not enforce it, so the remote-sign-out guarantee is only as strong as the client honouring it. The audit also flags two non-cross-referencing 'your devices' systems (Devices panel vs Live Stints) as an overhaul theme.","links":{"md":"supabase/migrations/045_device_management.sql"},"sources":["supabase/migrations/045_device_management.sql","docs/audits/2026-07-21-SYNTHESIS.md NOW #2"]},{"id":"invites","label":"Invites & Onboarding Gate","type":"feature","status":"live","updatedAt":"2026-07-29","activity":"Migrations 043/044/059 — app-level invites, an invite-kinds remodel, and short invite tokens; invite-check gates the public download page without consuming the token.","blurb":"Tabatha is invite-only, and the invite system is the gate on the whole funnel: it guards the download page, mints app-level and org-level invites, and sets profile defaults on redemption. A quiet piece of infrastructure that has had four migrations of iteration, which tells you it is load-bearing.","links":{"md":"supabase/migrations/059_short_invite_tokens.sql"},"sources":["supabase/migrations/043,044,059","supabase/functions/invite-check/index.ts"]},{"id":"org-teams","label":"Orgs, Teams & Hours","type":"feature","status":"partial","priority":"high","updatedAt":"2026-07-25","activity":"7/25: migration 060 added get_org_hours_summary and set_share_hours_with_org — the consent-gated RPC the audit specced as NOW #5.","blurb":"The multi-tenant layer that turns a personal tool into something a business can run payroll against. Deliberately paused on consent: migration 019 computed the right aggregates but granted them to service_role only, by design, until #221 specified the opt-in shape. Default behaviour returns aggregate totals only, and personal-realm data is hard-fenced out regardless of opt-in.","links":{"md":"supabase/migrations/060_org_hours_summary_rpc.sql","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216897421066930","label":"Po call (2026-07-24) privacy features — non-work window exclusion/redaction + whitelist-mode tracking + call follow-ups"}},"comments":0,"sources":["supabase/migrations/019,026,060","docs/audits/2026-07-21-SYNTHESIS.md NOW #5"]},{"id":"bug-rls-revoke","label":"Revoked Device Can Un-Revoke Itself","type":"bug","status":"broken","priority":"high","updatedAt":"2026-07-21","activity":"7/21: independently confirmed STILL OPEN despite the 6.7.54 session-aware application fix — migration 016's bare WITH CHECK has no session-identity test.","blurb":"A revoked session's still-valid JWT can hit the Supabase REST API directly, bypassing the extension UI, and clear its own revoked_at. Scope is same-profile only, but it defeats the remote-sign-out guarantee for that device. Named the single highest-leverage fix in the device-lifecycle area, and it is a small one — a WITH CHECK or a BEFORE UPDATE trigger.","links":{"md":"docs/audits/2026-07-21-SYNTHESIS.md"},"sources":["docs/audits/2026-07-21-SYNTHESIS.md NOW #2"]},{"id":"bug-sync-root-a","label":"Sync Root Cause A — Recency Arbitration","type":"bug","status":"broken","priority":"high","updatedAt":"2026-07-25","activity":"7/25: filed to the tracker together with Root Cause D, explicitly needing a new plan (#047). Nothing built.","blurb":"Cross-surface conflicts are arbitrated by recency, which means the last writer wins regardless of whether it knew anything. Combined with once-per-install pull-downs, a device that drifts never converges back. This is the architectural root beneath every 'sync is a little off' report Malkio has filed.","links":{"md":"docs/audits/2026-07-24-sync-forensics.md","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216903467194391","label":"Sync architecture — Root Cause A (recency-based arbitration, needs plan #047) + Root Cause D (clock adoption duplicates shifts)"}},"comments":0,"sources":["docs/audits/2026-07-24-sync-forensics.md","Asana 1216903467194391"]},{"id":"bug-sync-root-d","label":"Sync Root Cause D — Duplicate Shifts","type":"bug","status":"broken","updatedAt":"2026-07-25","activity":"7/25: filed alongside Root Cause A. Blocks #221 clock editing until an immutable session id exists.","blurb":"Shift rows are keyed by an ID hashed from their clock times, so clock adoption across devices — and any future time edit — inserts a duplicate row instead of updating the existing one. It is why the clock-backdate feature cannot simply be built: the fix has to land in the data model first.","links":{"md":"docs/features/221-clock-backdate-and-recovery.md"},"sources":["docs/features/221-clock-backdate-and-recovery.md","Asana 1216903467194391"]},{"id":"plan-047-sync","label":"Plan 047 — Sync Arbitration","type":"plan","status":"planned","updatedAt":"2026-07-25","activity":"7/25: number reserved and referenced from the #221 spec and the Root Cause task. No plan document exists yet in docs/plans/.","blurb":"The reserved slot for fixing sync arbitration properly. Notable for what it is not: docs/plans/ contains 037, 038, 040-045 — there is no plan-047 file. The number was minted by an addendum correction, so this is a placeholder for the most structurally important unstarted work in the system.","links":{"md":"docs/plans/"},"sources":["Tabatha_Changelog.md v6.7.80 addendum","docs/plans/ listing"]},{"id":"corin-sync-integrity","label":"Sync Integrity Cluster","type":"task","status":"in-progress","updatedAt":"2026-07-25","activity":"7/25: Corin's cluster covering findings #4/#5/#7/#9 from the 2026-07-24 platform review; four comments in one working session.","blurb":"The remediation batch spun out of the 24 July cross-surface sync forensics — the tactical half of the sync problem, as distinct from the architectural half that Plan 047 owns. Active work front as of the last tracker activity.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216867449144216","label":"[Corin] Sync integrity cluster #4/#5/#7/#9 — 2026-07-24"}},"comments":4,"lastComment":"2026-07-25","sources":["Asana 1216867449144216"]},{"id":"desktop-companion","label":"Desktop Companion (Tauri)","type":"service","status":"live","priority":"high","updatedAt":"2026-07-23","activity":"7/23: v0.3.10 released to GitHub (tag desktop-v0.3.10). package.json, tauri.conf.json and Cargo.toml all agree on 0.3.10 — the portfolio's 'v0.1.0 shipped' is three minor versions stale.","blurb":"'Tabby Desk' — a Windows tray app in 8703 lines of Rust across 14 modules, and the surface that makes Tabatha an attention OS rather than a browser extension. It shipped, kept shipping, and is now on its tenth patch of the 0.3 line. Its version story is the single most misreported fact in the workspace docs.","links":{"gh":{"url":"https://github.com/MrMalkio/tabatha/releases/tag/desktop-v0.3.10","label":"Release desktop-v0.3.10 — Tabatha Desktop Companion 0.3.10 (Windows)"},"md":"docs/system-map/COMPANION-MAP.md"},"comments":0,"sources":["tabatha-desktop git HEAD 28c96a0","gh release list MrMalkio/tabatha"]},{"id":"os-focus-tracking","label":"OS-Level Focus Tracking","type":"capability","status":"live","priority":"high","updatedAt":"2026-07-23","activity":"window_monitor.rs (245 lines) polls the Win32 foreground window; categorizer.rs (259 lines) maps executables to categories; activity_log.rs (901 lines) persists to bundled SQLite.","blurb":"The capability nothing else in the family has: knowing what you are doing when the browser is not in front. Active-window title and executable, idle state, and per-app time, logged locally to SQLite and bridged to the extension. This is the literal extension of the attention model past the browser's edge, and it is why the product can claim 'operating system' rather than 'tab manager'.","links":{"md":"docs/system-map/COMPANION-MAP.md"},"sources":["tabatha-desktop/src-tauri/src/window_monitor.rs","activity_log.rs","categorizer.rs"]},{"id":"ws-bridge","label":"Local WebSocket Bridge :9147","type":"integration","status":"live","priority":"high","updatedAt":"2026-07-23","activity":"ws_server.rs is the largest Rust module at 1932 lines; the extension side is companionService.js at 759 lines.","blurb":"How the desktop app and the browser extension talk: ws://localhost:9147/tabatha. The code itself documents the risk in a comment — the socket is reachable by ANY process on the machine, including any web page that opens a WebSocket to localhost — which is precisely why the Stage-2 handshake work exists.","links":{"md":"src/background/services/companionService.js"},"sources":["tabatha-desktop/src-tauri/src/ws_server.rs L2,25,45-46","src/background/constants.js L156"]},{"id":"ws-handshake","label":"WS Stage-2 Handshake Auth","type":"feature","status":"partial","priority":"high","updatedAt":"2026-07-20","activity":"7/20: 16 comments on the Dex task, then twelve personal reminders through 7/21 and no comment since — the busiest thread in the tracker that then went quiet.","blurb":"Authenticating the localhost bridge so an arbitrary web page cannot impersonate the extension. There is a dedicated branch (feat/ws-stage2-handshake-auth) and the single most-discussed task in the tracker, but the discussion stopped on 20 July and turned into a run of self-reminders. Classic loud-then-abandoned thread on a security-relevant seam.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216679341518745","label":"Extension: companion WS HELLO handshake (Stage-2 client side) — Dex"}},"comments":16,"lastComment":"2026-07-20","sources":["Asana 1216679341518745","tabatha-desktop branch feat/ws-stage2-handshake-auth"]},{"id":"desktop-capture","label":"Companion Screen Capture","type":"feature","status":"live","updatedAt":"2026-07-23","activity":"screen_capture.rs at 1449 lines; the extension's captureService.js marks its own C3 external-archive path as a stub because the companion is now the concrete implementation.","blurb":"OS-level screen capture with redaction, feeding the Cortex observation ledger. Moving capture out of the browser was the right call — it dodged the Save-As dialog problem entirely and gave Cortex frames from every app, not just Chrome. The extension-side stub comment is the visible seam where that handoff happened.","links":{"md":"docs/cortex/DATA-MAP.md"},"sources":["tabatha-desktop/src-tauri/src/screen_capture.rs","src/background/services/captureService.js L203"]},{"id":"desktop-updater","label":"Companion Auto-Update","type":"feature","status":"partial","updatedAt":"2026-07-23","activity":"7/23: 0.3.10 added visible update-check feedback and an out-of-date badge — the fix for an updater that used to succeed or fail silently.","blurb":"Tauri updater plus a manual check, driven by a manifest at site/desktop/latest.json. Partial because that manifest is stale: it still advertises desktop-v0.2.1 while 0.3.10 is the published release, so the in-app updater is pointing users at a version eight patches old.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216818594565452","label":"Companion update-check visible feedback + out-of-date indicator"}},"comments":0,"sources":["site/desktop/latest.json","tabatha-desktop git log 28c96a0"]},{"id":"desktop-code-signing","label":"Companion Code Signing","type":"task","status":"blocked","updatedAt":"2026-07-23","activity":"A feat/code-signing branch and a docs/CODE-SIGNING.md exist on the remote; not merged into the release line.","blurb":"Unsigned Windows installers mean every staff install fights SmartScreen. The branch and the runbook exist but the work never landed, which quietly taxes every companion rollout — and the companion is the surface with the most install friction already.","links":{"md":"docs/system-map/COMPANION-BACKLOG.md"},"sources":["tabatha-desktop branch feat/code-signing","tabatha-desktop/docs/CODE-SIGNING.md"]},{"id":"companion-parity-gap","label":"Companion Parity Backlog (16)","type":"task","status":"planned","priority":"high","updatedAt":"2026-07-25","activity":"7/25: filed from the 7/19 parity audit — 20 sidebar options and 18 sidecar options missing from the companion, consolidated to 16 recommended additions.","blurb":"The companion sees what app you are in but not why. It has no current-focus card, no lifecycle controls, no checkpoint capture, no backburner, no off-computer toggle — the one control it is uniquely qualified to own. Closing this turns the desk panel from a passive logger into a control surface for when the browser is closed.","links":{"md":"docs/audits/2026-07-19-surface-parity.md","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216897420987380","label":"Companion parity backlog — 16 options from sidebar/sidecar to add to Tabby Desk (audit doc)"}},"comments":0,"sources":["docs/audits/2026-07-19-surface-parity.md","Asana 1216897420987380"]},{"id":"bug-assign-intent-deadend","label":"Assign-to-Intent Is Cosmetic","type":"bug","status":"broken","updatedAt":"2026-07-21","activity":"7/21: escalated deliberately as a product-communication decision rather than silently patched — the auditor recommended raising it with Malkio before any announcement.","blurb":"The companion lets you assign an OS window to an intent, and it looks like it works — but the assignment never feeds time totals. A feature that appears to record work and does not is worse than a missing feature, and the audit correctly refused to treat it as a code fix.","links":{"md":"docs/audits/2026-07-21-sidecar-companion-watch-ux-audit.md","asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216808364397396","label":"TR-02 Companion 0.3.9 fix pass"}},"comments":1,"lastComment":"2026-07-23","sources":["docs/audits/2026-07-21-SYNTHESIS.md NOW #3"]},{"id":"sidecar-pwa","label":"Tabby Sidecar (phone PWA)","type":"surface","status":"live","priority":"high","updatedAt":"2026-07-29","activity":"8/1: probed live — https://tabatha.pondocean.co/sidecar returns 200. app.json in the checked-out branch reads 0.11.0; the newest release commit references 0.13.14.","blurb":"THE live mobile surface, and the answer to 'which mobile effort is real': neither standalone repo — it is an Expo app living inside the main Tabatha repo at sidecar/, deployed as a PWA on a Cloudflare Worker. Ten screens including a landscape Context View, direct-to-Supabase data, realtime subscriptions and Web Push. It went 0.0.1 → 0.2.1 in a single 48-hour stretch in July and has been the fastest-moving surface since.","links":{"web":{"url":"https://tabatha.pondocean.co/sidecar","label":"Tabby Sidecar — live PWA"},"gh":{"url":"https://github.com/MrMalkio/tabatha/pull/24","label":"PR #24 — feat(sidecar): v0.1.0 — full sidebar parity, PWA, unified clock, expanded push (Plan 039)"}},"comments":0,"sources":["sidecar/app.json","live curl probe 2026-08-01","GitHub PRs #23-#26"]},{"id":"sidecar-context-view","label":"Context View (3rd screen)","type":"feature","status":"live","updatedAt":"2026-07-18","activity":"Shipped in Sidecar v0.2.0 with realtime; v0.2.1 added the phone-away red accountability alert.","blurb":"A landscape, view-only display for a spare monitor or a TV: giant current focus, timer, up-next, a day countdown, and a red alert when the phone has wandered off. This is the most distinctive thing the phone surface does — turning an old device into an ambient accountability display rather than another place to poke at the app.","links":{"gh":{"url":"https://github.com/MrMalkio/tabatha/pull/26","label":"PR #26 — feat(sidecar): v0.2.1 — phone-away red accountability alert on the Context View"}},"comments":0,"sources":["GitHub PRs #25, #26","sidecar/src/app/"]},{"id":"phone-focus-mode","label":"Phone Focus Mode","type":"feature","status":"live","updatedAt":"2026-07-17","activity":"Shipped in Sidecar v0.1.0 using the Page Visibility API; feeds the 3-way phone-away heartbeat.","blurb":"Uses page visibility to detect that you have put the phone down — or picked it up mid-focus — and turns that into an accountability signal rather than a notification. Combined with the companion's idle state and the browser's own activity, it gives a three-way read on whether the human is actually working.","links":{"md":"sidecar/src/components/PhoneFocusMode.tsx"},"sources":["sidecar/src/components/PhoneFocusMode.tsx","GitHub PR #24"]},{"id":"watch-app","label":"Tabby Watch (Wear OS)","type":"surface","status":"partial","priority":"high","updatedAt":"2026-07-24","activity":"7/24: HEAD is 0.2.2 on branch fix/watch-0.2.1-polish, adding staleness timestamps and error/empty disambiguation. 29 Kotlin files including 5 test files.","blurb":"A Wear OS 4 companion for the Galaxy Watch 6, and the surface no portfolio document mentions at all. Real architecture, not a toy: pure unit-tested TimerEngine mirroring the Sidecar's math, hand-rolled PostgREST rather than a heavyweight SDK, Keystore-backed sessions, manual DI. Partial because its own README still claims version 0.1.0 while the build says 0.2.2, and no release artifact exists.","links":{"md":"docs/audits/2026-07-21-sidecar-companion-watch-ux-audit.md","web":{"url":"https://tabatha.pondocean.co/show/components-watch.html","label":"Watch components on the live /show showcase"}},"sources":["tabatha-watch/app/build.gradle.kts versionName 0.2.2","tabatha-watch/README.md"]},{"id":"watch-pairing","label":"Password-Free Watch Pairing","type":"feature","status":"live","updatedAt":"2026-07-25","activity":"v0.2.0 shipped the Pair screen — described in its own commit as 'the missing path out of fixture mode'.","blurb":"The watch never asks for or stores a password. The phone shows a 6-digit code valid for five minutes; the watch exchanges it via the pair-watch function for its own session token, stored in the Android Keystore. Elegant, and the reason a wrist device can join a Supabase account at all.","links":{"md":"supabase/migrations/040_watch_pairing_codes.sql"},"sources":["tabatha-watch/README.md pairing section","tabatha-watch git log dc7bcd4"]},{"id":"watch-tile","label":"Watch Tile & Complication","type":"feature","status":"partial","updatedAt":"2026-07-24","activity":"7/24: 0.2.2 added a staleness timestamp on the Tile cache and disambiguated error from empty states.","blurb":"Current focus on a swipe-left card and on the watch face itself — the most glanceable surface in the family. The 0.2.2 work is telling: showing stale cached data without saying it is stale is the characteristic failure mode of a wrist surface, and it took a dedicated fix pass to admit uncertainty in the UI.","links":{"asana":{"url":"https://app.asana.com/1/9526911872029/project/1214031898449333/task/1216808418576257","label":"TR-05 Watch network crash-guard 0.2.1"}},"comments":1,"lastComment":"2026-07-23","sources":["tabatha-watch app/src FocusTileService.kt, FocusComplicationService.kt"]},{"id":"bug-watch-crash","label":"Watch Crashed On Any Network Failure","type":"bug","status":"killed","updatedAt":"2026-07-23","activity":"Fixed in 0.2.1 — 'guard all repository calls with runCatching (no crash on network failure)'.","blurb":"Every repository call in the watch was unguarded, so any connectivity blip took the whole app down. Flagged as a ship-blocker for any watch update by the 21 July audit and fixed two days later. Worth keeping visible a moment longer as the cleanest example of the audit-to-fix loop actually closing.","links":{"md":"docs/audits/2026-07-21-sidecar-companion-watch-ux-audit.md"},"sources":["tabatha-watch git log 5f8977f","docs/audits/2026-07-21-SYNTHESIS.md NOW #4"]},{"id":"mobile-expo-legacy","label":"tabatha-mobile (abandoned)","type":"surface","status":"killed","updatedAt":"2026-05-30","activity":"19 commits, ALL in May 2026, last on 2026-05-30. Nothing since. Working tree still dirty with 3 uncommitted files.","blurb":"The first mobile attempt — React Native / Expo with a genuinely ambitious native Android module for UsageStatsManager tracking, a foreground service, a ported categorizer and local SQLite. It got further than most abandoned efforts and then simply stopped. Its FEATURES.md still shows unchecked boxes for the focus-matching work that would have made it useful.","links":{"md":"docs/system-map/SYSTEM-MAP.md"},"sources":["git log tabatha-mobile (19 commits, all 2026-05)","tabatha-mobile/FEATURES.md"]},{"id":"mobile-android-lab","label":"tabatha-mobile-2 (design lab)","type":"surface","status":"killed","updatedAt":"2026-05-30","activity":"6 commits, ALL on a single day (2026-05-30). Final commit: 'feat(design): pivot AI Studio to UI/UX design lab'.","blurb":"Not a competing mobile app — a Google AI Studio scaffold that lived for one day. The Kotlin is 15 generated files in the `com.example` package with an ExampleInstrumentedTest, and the README is still Google's AI Studio banner. Its lasting value is FEATURE_AUDIT_V6.md, a genuinely thorough inventory of the extension's v6 feature surface that remains the best parity reference in the workspace.","links":{"md":"docs/system-map/SYSTEM-MAP.md"},"sources":["git log tabatha-mobile-2 (6 commits, 2026-05-30)","tabatha-mobile-2/README.md","tabatha-mobile-2/app/src (com.example package)"]},{"id":"goal-surface-parity","label":"GOAL: One OS, Every Surface","type":"goal","status":"in-progress","priority":"high","updatedAt":"2026-07-25","activity":"7/19 parity audit quantified the gap: 20 sidebar options and 18 sidecar options absent from the companion; the extension still cannot render backburner/sub-intents/checkpoints that exist data-layer-wide.","blurb":"The defining ambition: the same attention state, controllable from wherever you are — browser, desktop, phone, wrist. The data layer already achieves it; the UIs do not. Parity gaps run in BOTH directions, with the Sidecar ahead of the extension on several features the extension's own backend already supports.","links":{"md":"docs/audits/2026-07-19-surface-parity.md"},"sources":["docs/audits/2026-07-19-surface-parity.md","docs/audits/2026-07-21-SYNTHESIS.md OVERHAUL theme 5"]},{"id":"site-marketing","label":"Marketing Site","type":"surface","status":"live","updatedAt":"2026-08-01","activity":"8/1: probed live — tabatha.pondocean.co returns 200. Deployed via wrangler to Cloudflare Pages project `tabatha` on branch main.","blurb":"The public face: a teaser homepage with a waitlist, privacy policy, enterprise and desktop paths. Still framed as 'Not released yet', which is accurate — the product ships through invite and force-install channels, not open signup. Carries a real CSP with no third-party origins at all.","links":{"web":{"url":"https://tabatha.pondocean.co","label":"tabatha.pondocean.co — live marketing site"}},"sources":["live curl probe 2026-08-01","site/_headers","package.json site:deploy"]},{"id":"showcase-show","label":"/show Component Showcase","type":"surface","status":"live","updatedAt":"2026-08-01","activity":"8/1: probed live — /show returns 200. 15 pages: per-surface frames plus nine components-* category pages, a roadmap, and a search index.","blurb":"A living component gallery rendered from the project's own code and tokens, with per-surface frames for gatekeeper, home, popup, sidebar, settings, workshifts and backdating, plus category pages for companion, watch, mobile, sidecar and org. It doubles as the source of the Chrome Web Store screenshots and has its own maintenance skill so updates land in every place they must.","links":{"web":{"url":"https://tabatha.pondocean.co/show/","label":"/show — live component showcase and roadmap"}},"sources":["live curl probe 2026-08-01","site/show/ (15 pages)",".claude/skills/showcase-site-update"]},{"id":"docs-site","label":"User Docs Site","type":"surface","status":"partial","updatedAt":"2026-07-21","activity":"7/21: version badge hardcoded to v6.7.41 and eight shipped features missing or stale. No freshness-check mechanism exists at all.","blurb":"Thirteen user-facing doc pages with their own search index, covering getting started for each surface. Partial because it drifts by construction: the version is hardcoded rather than driven from manifest.json, and there is no CI gate comparing docs against the changelog — so it is stale the moment anything ships.","links":{"web":{"url":"https://tabatha.pondocean.co/docs/getting-started-extension.html","label":"Tabatha user docs — getting started"}},"sources":["site/docs/","docs/audits/2026-07-21-SYNTHESIS.md NOW #7"]},{"id":"download-page","label":"Download Page","type":"surface","status":"live","updatedAt":"2026-07-21","activity":"Invite-gated via the invite-check edge function; offers extension, companion and sidecar paths.","blurb":"The single funnel into the product, gated by a non-consuming invite check so a bad code fails before anything is spent. It points at the Chrome Web Store ID — which is the one link on it that does not yet resolve to a published listing.","links":{"web":{"url":"https://tabatha.pondocean.co/download.html","label":"Tabatha download page (invite-gated)"}},"sources":["site/download.html","supabase/functions/invite-check/index.ts"]},{"id":"waitlist","label":"Waitlist","type":"feature","status":"live","updatedAt":"2026-07-21","activity":"Migration 028 created the table with RLS on and no policies, so the service-role Pages Function is the only write path.","blurb":"Email capture on the teaser homepage, written through a Cloudflare Pages Function holding the service-role key. A tidy pattern — the table is deliberately unreachable from any client, so the function is the only door.","links":{"md":"functions/api/waitlist.js"},"sources":["functions/api/waitlist.js","supabase/migrations/028_waitlist.sql"]},{"id":"cf-pages-functions","label":"Pages Functions API","type":"service","status":"live","updatedAt":"2026-07-21","activity":"Two endpoints: POST /api/feedback and POST /api/waitlist. Both return 501 and degrade gracefully when their env bindings are absent.","blurb":"The site's small server-side surface, running on Cloudflare Pages alongside the static build. Notable for degrading honestly rather than failing opaquely — an unconfigured feedback endpoint falls back to a prefilled GitHub issue instead of swallowing the report.","links":{"md":"functions/api/feedback.js"},"sources":["functions/api/","site/_headers"]},{"id":"channel-staff","label":"Staff Self-Hosted Update Channel","type":"infra","status":"live","priority":"high","updatedAt":"2026-07-25","activity":"8/1: probed live — latest.json advertises 6.7.78, published 2026-07-25. HEAD is 6.7.82, so the channel is FOUR versions behind the repo.","blurb":"Builds with the pinned manifest key so every staff install keeps the same extension ID release over release and Cloud Sync never orphans them. Zips to a GitHub Release tagged ext-vX.Y.Z and commits a latest.json to an orphan `update-channel` branch served from raw.githubusercontent.com. Fully automated by one npm script — and running four versions stale.","links":{"web":{"url":"https://raw.githubusercontent.com/MrMalkio/tabatha/update-channel/latest.json","label":"latest.json — live staff update manifest (6.7.78)"},"gh":{"url":"https://github.com/MrMalkio/tabatha/releases/tag/ext-v6.7.78","label":"Release ext-v6.7.78 — Tabatha 6.7.78 (staff update channel)"}},"comments":0,"sources":["live curl probe 2026-08-01","docs/OPERATIONS.md §2.2","scripts/publish-update.mjs"]},{"id":"channel-enterprise","label":"Enterprise CRX Forc
